  /v1/files/{file}/taxonomies:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: listTaxonomies
      tags: [Taxonomies]
      summary: List the taxonomies a file defines, with their category trees
      description: |
        The key to the `classifications` object on a holding, which is keyed by
        taxonomy id and names its categories by path: without this list a client has
        an id it cannot label, and no way to know which categories exist but hold
        nothing.

        A taxonomy's root is not reported as a category — it names the taxonomy
        itself. That is the same convention the `classifications` paths follow, so
        the two line up without the caller stripping anything.

        Every category carries its own `id` and its assignments, so this is also
        the read side of editing a taxonomy: the writes below name a category by
        the `id` reported here. Categories are listed in the order the application
        shows them.
      responses:
        "200":
          description: The taxonomies defined in the file.
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Taxonomy"
              examples:
                default:
                  value:
                    items:
                      - id: 30314ba9-949f-4bf4-944e-6a30802f5190
                        name: Asset Allocation
                        categories:
                          - id: 2b0f6b1e-2f4a-4f45-9a41-3f9e7f0f2f11
                            name: Equity
                            color: "#89afee"
                            weight: 0.7
                            children:
                              - id: 8a1c0f52-0f2e-4a4b-9d18-6b1a5c2f9c40
                                name: Europe
                                weight: 0.3
                                assignments:
                                  - type: instrument
                                    uuid: 6a1f7bb4-1d1e-4f6e-9d02-1f6cf6f43b21
                                    name: iShares Core MSCI Europe
                                    weight: 1
                              - id: 4c9a7e3d-88b7-4a2f-b0a8-2e0f5a7d1c33
                                name: North America
                                weight: 0.4
                          - id: 91b3a2c7-6a5d-4c1e-8b77-0e2c8a4d5f66
                            name: Cash
                            color: "#c4e8e8"
                            weight: 0.3
                            assignments:
                              - type: cash-account
                                uuid: 0d5f2a11-9c3b-4d7e-8f10-77a2b3c4d5e6
                                name: CHF Cash Account
                                weight: 1
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTaxonomy
      tags: [Taxonomies]
      summary: Create an empty taxonomy
      description: |
        Creates a taxonomy with no categories, exactly as the application's own
        "new taxonomy" does. Categories are added one at a time afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
            examples:
              default:
                value:
                  name: Regions
      responses:
        "201":
          description: The created taxonomy.
          headers:
            Location:
              description: The URL of the created taxonomy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/taxonomies/{taxonomy}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Taxonomy"
    get:
      operationId: getTaxonomy
      tags: [Taxonomies]
      summary: Read one taxonomy and its category tree
      responses:
        "200":
          description: The taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchTaxonomy
      tags: [Taxonomies]
      summary: Rename a taxonomy
      description: |
        A **JSON Merge Patch** (RFC 7386): fields you omit stay untouched. Only
        `name` is writable; anything else is rejected `422` rather than silently
        ignored.

        The root classification is renamed with it. The root *is* the taxonomy —
        it is never reported as a category — so letting the two names drift would
        leave a tree whose root disagrees with the taxonomy above it.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                name:
                  type: string
            examples:
              rename:
                value:
                  name: Asset Classes
      responses:
        "200":
          description: The updated taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTaxonomy
      tags: [Taxonomies]
      summary: Delete a taxonomy and all of its categories
      description: |
        Nothing blocks this. A taxonomy holds no data of its own — only a
        classification of instruments and cash accounts that go on existing
        without it, which is why the application does not ask either.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/taxonomies/{taxonomy}/categories:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Taxonomy"
    post:
      operationId: createTaxonomyCategory
      tags: [Taxonomies]
      summary: Add a category to a taxonomy
      description: |
        Adds one category. It goes last among its siblings unless `position` says
        otherwise, and takes whatever target weight its siblings leave unclaimed —
        which is what the application's own "add category" does, so the first child
        of a parent starts at 1 and the next at 0.

        Returns the whole taxonomy, not just the new category: a client editing a
        tree needs the tree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyCategoryWrite"
            examples:
              topLevel:
                summary: A new top-level category
                value:
                  name: Emerging Markets
              child:
                summary: A child of an existing category, with a target weight
                value:
                  name: China
                  parent: 92c627d7-c26b-4316-9bfd-2dd57bfd62f6
                  color: "#d42c40"
                  weight: 0.25
      responses:
        "201":
          description: The taxonomy, including the new category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/taxonomies/{taxonomy}/categories/{category}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Taxonomy"
      - $ref: "#/components/parameters/Category"
    patch:
      operationId: patchTaxonomyCategory
      tags: [Taxonomies]
      summary: Rename, recolor, reweight, move or reorder a category
      description: |
        A **JSON Merge Patch** (RFC 7386): fields you omit stay untouched, and an
        explicit `null` clears an optional one.

        `parent` moves the category with its whole subtree; `null` moves it to the
        top level, the root being the taxonomy rather than a category. Moving a
        category into itself or into one of its own children is rejected `422`
        rather than clamped — it would detach that subtree from the tree.

        `position` is the index among the siblings it ends up with, clamped to the
        end of the list.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/TaxonomyCategoryWrite"
            examples:
              rename:
                value:
                  name: Developed Markets
              move:
                summary: Move to the top level, first
                value:
                  parent: null
                  position: 0
      responses:
        "200":
          description: The updated taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTaxonomyCategory
      tags: [Taxonomies]
      summary: Delete a category and everything below it
      description: |
        The instruments and cash accounts it classified are not touched — they
        simply stop being classified in this taxonomy, exactly as in the
        application.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/taxonomies/{taxonomy}/categories/{category}/assignments/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Taxonomy"
      - $ref: "#/components/parameters/Category"
      - $ref: "#/components/parameters/Uuid"
    put:
      operationId: assignToTaxonomyCategory
      tags: [Taxonomies]
      summary: Assign an instrument or cash account to a category
      description: |
        Assigns the vehicle named by `uuid` — an instrument or a cash account — to
        the category, or changes the share already assigned there. It is the same
        call either way, so a client can retry after a `423` without first asking
        which of the two it is.

        A vehicle can be split across the categories of one taxonomy, so `weight`
        is a share rather than a flag. Left out, it claims everything the
        taxonomy's other categories have not — which is what dropping a security
        onto a category means in the application, where the remainder waits in a
        virtual "unassigned" node. That remainder is never stored, and this API
        does not report it: subtract the assignments from 1.

        Over-assigning is refused `422` rather than clamped: a silently reduced
        share is a wrong allocation nobody sees. The message names what is left.

        The body may be omitted entirely, which is the same as `{}`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                weight:
                  type: number
                  description: |
                    The share to assign, as a fraction above 0 and at most 1.
                    Defaults to everything the taxonomy's other categories leave.
            examples:
              whole:
                summary: Assign whatever is unassigned
                value: {}
              split:
                summary: Assign a third of the position here
                value:
                  weight: 0.3333
      responses:
        "200":
          description: The updated taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unassignFromTaxonomyCategory
      tags: [Taxonomies]
      summary: Remove an instrument or cash account from a category
      description: |
        Removes the vehicle from this one category. It stays assigned wherever
        else in the taxonomy it is: a split assignment is removed one category at
        a time. A vehicle that is not assigned here is `404`.
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/transactions:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List every transaction across every account
      description: |
        Every transaction across every cash account and investment account,
        newest first. A buy/sell pair and a transfer are each recorded on both
        sides internally, but appear here only once: a buy/sell as its
        investment-account (portfolio) leg, a transfer as its outbound leg.

        `value` is the signed net cash flow — negative for a debit (a cash
        account's removal, fee, tax, transfer-out, …) or a liquidation (an
        investment account's sell, transfer-out, delivery-outbound); positive
        otherwise. `grossValue`, `fees` and `taxes` are plain (unsigned)
        magnitudes in the transaction's own currency.

        With `account`, the list is every transaction that **touches** that
        account instead: for a cash account also the cash legs of buys and
        sells and both legs of a transfer, for an investment account both
        sides of a transfer between investment accounts. Each entry is
        reported from that account's side — `owner` is the requested account
        and `counterOwner` the other side of a cross entry — and appears once.
        The signed `value`s of a cash account's entries therefore add up to the
        account's closing balance in `.../cash-accounts/{uuid}/balances`.

        All filters are optional and combine with AND. Unfiltered, the response is
        the file's entire transaction list.
      parameters:
        - name: from
          in: query
          required: false
          description: |
            Earliest transaction date to include, **inclusive**. This endpoint
            selects records rather than valuing the portfolio at two dates, so —
            unlike a reporting period — `[from, to]` is closed at both ends. An
            inverted range is rejected `400 invalid-range`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Latest transaction date to include, **inclusive**.
          schema:
            type: string
            format: date
        - name: account
          in: query
          required: false
          description: |
            The uuid of a cash account or an investment account. With it the
            list is every transaction that touches the account (see above)
            rather than only those it owns. A uuid the file does not know is
            rejected `400 invalid-value`.
          schema:
            type: string
            format: uuid
        - name: security
          in: query
          required: false
          description: |
            Instrument uuid. Only transactions carrying that instrument are
            returned; a uuid the file does not know is rejected
            `400 invalid-value`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Every transaction, newest first
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
              examples:
                default:
                  value:
                    items:
                      - uuid: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d
                        date: "2026-07-20T00:00"
                        type: dividends
                        value: { value: 42.5, currency: EUR }
                        grossValue: { value: 50, currency: EUR }
                        fees: { value: 0, currency: EUR }
                        taxes: { value: 7.5, currency: EUR }
                        shares: 10
                        security:
                          uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                          name: Apple Inc.
                        owner:
                          uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                          name: Broker Cash
                          type: cash-account
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Book a transaction
      description: |
        Books one transaction. `type` is the discriminator and decides which
        other fields apply; a field belonging to another type is rejected
        `not-applicable` rather than ignored, because a field silently dropped
        looks like a field that was honored.

        | `type` | shape |
        | --- | --- |
        | `deposit` `removal` `interest` `interest-charge` `dividends` `fees` `fees-refund` `taxes` `tax-refund` | one cash account |
        | `buy` `sell` | an investment account **and** the cash account paying for it |
        | `delivery-inbound` `delivery-outbound` | an investment account, no cash leg |
        | `transfer` | between two cash accounts |
        | `security-transfer` | between two investment accounts |

        The last four create a **cross entry**: one call books both legs, and
        the response is the leg the read endpoint reports (the investment
        account's for a trade, the outbound one for a transfer).

        `amount` is the **net** cash flow and is unsigned — the direction
        belongs to the type, so a `removal` of `-50` is rejected rather than
        read as a deposit. The gross value is derived from it and the fee and
        tax units, and the direction of that derivation is the model's own: a
        credit had its fees and taxes withheld (`gross = amount + fees + taxes`)
        while a purchase paid them on top (`gross = amount − fees − taxes`). A
        `grossAmount` sent along is **checked against that derivation**, never
        trusted in place of it.

        Every monetary field must be denominated in the transaction's own
        currency — the cash account's, or for a delivery the one `amount` names,
        or for a security transfer the instrument's. Converting silently would
        book a figure the caller never sent. The one exchange rate recorded
        anywhere is the optional `exchangeRate`/`forexGrossAmount` pair on a
        trade in a foreign-currency instrument, which pins the rate the broker
        actually used; a cross-currency `transfer` derives its rate from the two
        amounts, since they already imply it.

        Validation mirrors the desktop application's transaction dialogs, which
        is the only place these rules exist — the model itself accepts anything.
        All violations are reported at once as `422`, so one round-trip is
        enough to fix a form.

        An optional client-generated `uuid` makes the call **idempotent**: it
        becomes the transaction's identity, and a replay is answered `409
        duplicate-uuid` rather than booking a second one. Send one on any retry
        path — after a `423`, a timeout, or a restart.

        The write is applied to the model in memory and marks the file dirty;
        as everywhere else in v1, only the user saves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
            examples:
              deposit:
                summary: A deposit
                value:
                  type: deposit
                  account: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  date: "2026-07-20"
                  amount: { value: 1000, currency: EUR }
                  note: Salary
              dividend:
                summary: A dividend with tax withheld
                value:
                  type: dividends
                  account: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  security: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                  date: "2026-07-20"
                  shares: 10
                  amount: { value: 42.5, currency: EUR }
                  taxes: { value: 7.5, currency: EUR }
                  exDate: "2026-07-06"
              buy:
                summary: A purchase, with a client-supplied uuid so a retry cannot double-book it
                value:
                  uuid: 3f1c9a52-6b47-4d0e-9a71-2c8e5b04d913
                  type: buy
                  portfolio: 5f2d8c1a-9b3e-4a7c-8d0f-1e6b4a2c9d75
                  account: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  security: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                  date: "2026-07-20"
                  shares: 10
                  amount: { value: 1009.9, currency: EUR }
                  fees: { value: 9.9, currency: EUR }
              transfer:
                summary: A cross-currency transfer between two cash accounts
                value:
                  type: transfer
                  fromAccount: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  toAccount: 7d3b6e94-1a52-4c8f-b0d3-9e2a5c17f486
                  date: "2026-07-20"
                  amount: { value: 1000, currency: EUR }
                  toAmount: { value: 1082.4, currency: USD }
      responses:
        "201":
          description: The transaction as booked
          headers:
            Location:
              description: The canonical URL of the new transaction.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/transactions/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Delete a transaction
      description: |
        Deletes the transaction and, when it is one leg of a cross entry, **the
        other leg with it** — a buy without its cash movement, or a transfer with
        one side left behind, is not a state the model has a name for. Either leg
        may be named: the uuid the read endpoint reports, or the hidden one.

        There is no undo, and no `If-Match`: this API is designed for a single
        client (see the ADR), and the only other actor is the desktop user, whose
        open dialogs are already covered by `423`.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/imports:
    parameters:
      - $ref: "#/components/parameters/File"
    post:
      operationId: createImport
      tags: [Imports]
      summary: Extract transactions from a statement, for review
      description: |
        Uploads one bank statement and runs the extractor its **filename**
        selects — the PDF assistant, which auto-detects the issuing bank from
        the document's own text, the Interactive Brokers Flex reader for an
        `.xml` statement, or a `.csv` file read with a named saved
        configuration. Nothing is written: the result is a **preview** to
        review, kept as a session.

        The three-step shape (extract, review, apply) is not ceremony. An
        extracted item holds live references into the model — a security that
        may not be in the file yet, an account the extractor guessed — so it
        cannot be handed to a client and given back. The client reviews a
        rendering of the items and applies them by **index**.

        The body is the file itself, not a multipart form: the API takes one
        file per import, and the content type is whatever the file is. Up to
        **16 MiB**, rather than the 1 MiB every JSON endpoint is held to;
        anything larger is `413 request-too-large`.

        A `.csv` upload has no format of its own to auto-detect, so the
        column mapping has to be named rather than guessed — one of `config`
        or `mapping` is required (naming both is rejected). `config` names one
        of the saved configurations `GET .../imports/configs` lists. `mapping`
        instead supplies one inline, as the JSON object `POST
        .../imports/csv-preview` is built to feed: `label`, `target`
        (the extractor code — see `listImportConfigs`), `delimiter`,
        `encoding`, `skipLines`, `isFirstLineHeader`, and `columns` — one
        entry per column of the file, in file order, each an object with
        `label` (the header text; cosmetic, kept for round-tripping) and
        optional `field` (a code from the matching target's `fields` in the
        preview) and `format` (a code from that field's `formats`); a column
        with no `field` is left unmapped. An `encoding` this server's JVM does
        not provide is refused `422` on `mapping.encoding` rather than
        substituted: reading a file with the wrong charset does not fail, it
        produces mojibake, so a silent substitution would be invisible. Add
        `save=true` to keep it under its
        own `label` for later reuse by `config` — kept in memory for the
        life of the server process, not written to a file, so it does not
        survive a restart and is not shared between server instances; a
        configuration saved from the desktop wizard is separate and still not
        visible over the API.

        Sessions live in memory for 30 minutes and die with the application. A
        lost session costs a re-upload, which is why nothing is written until
        the apply step.
      parameters:
        - name: filename
          in: query
          required: true
          description: |
            The name of the uploaded file. It **selects the extractor** (`.pdf`,
            `.xml` or `.csv`), so it is required rather than cosmetic.
          schema:
            type: string
        - name: config
          in: query
          required: false
          description: |
            The saved CSV configuration to read the file with, by its `label`
            (`GET .../imports/configs` lists the available ones). Required for
            a `.csv` upload unless `mapping` is given instead; ignored for a
            `.pdf` or `.xml` upload.
          schema:
            type: string
        - name: mapping
          in: query
          required: false
          description: |
            An inline column mapping for a `.csv` upload, as JSON — see this
            operation's description for the shape. An alternative to `config`;
            naming both is rejected.
          schema:
            type: string
        - name: save
          in: query
          required: false
          description: |
            When `true` together with `mapping`, keeps the mapping under its
            own `label` so a later `config` can name it. Ignored otherwise.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The extraction, to review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/imports/csv-preview:
    parameters:
      - $ref: "#/components/parameters/File"
    post:
      operationId: previewCsvColumns
      tags: [Imports]
      summary: Preview a CSV file's columns, for building a mapping
      description: |
        Reads only the header row and up to five sample data rows of the
        uploaded `.csv` file, plus the fields every CSV target extractor
        (`account-transaction`, `portfolio-transaction`, `investment-vehicle`,
        `investment-vehicle-price`, `portfolio`) knows how to fill — enough
        for a client to render a column-mapping UI without committing to one.
        Nothing is written or kept: unlike `createImport`, there is no session
        here, because a preview a caller has not yet mapped is not something
        review or apply could act on.

        How the file is split is the caller's to state: `delimiter`,
        `encoding`, `skipLines` and `isFirstLineHeader` are the same four
        settings a `createImport` mapping carries, each optional here and each
        defaulting to the importer's own behavior, so a caller that names none
        gets exactly what this endpoint returned before they existed.

        Name them. The default delimiter is the **server JVM locale's** list
        separator, so an English-locale server splits on a comma and a German
        or Spanish one on a semicolon, and no client can know or control which.
        A comma-separated file previewed against a semicolon comes back as a
        single column whose label is the whole header line, and every target's
        `guesses` then matches nothing: the auto-detect below is only as good
        as the split it runs on. The settings are applied before the file is
        read, so `columns`, `sampleRows` and `guesses` are all computed on the
        split you asked for.

        The body is the `.csv` file itself, up to **16 MiB** like
        `createImport`, rather than the 1 MiB every JSON endpoint is held to.

        Every target also carries `guesses`: the mapping the application's own
        auto-detect produces for that target, one entry per column. It is the
        desktop wizard's matcher, not a weaker one written for the API, and a
        client cannot reproduce it — so the intended flow is to show the
        guesses for the chosen target as a filled-in mapping for the user to
        correct, rather than an empty one to build.

        Each field says what `type` of value it holds (`text`, `date`,
        `amount`, `enum`, `isin`) and lists the `formats` `createImport`'s
        `mapping.columns[].format` accepts for it, each with its own display
        label — a date field's available patterns, an amount field's
        decimal-separator convention. Omitting `format` lets the importer guess
        one from the column's first non-empty value, exactly as the desktop
        wizard's live preview does. An `enum` field has no formats to choose
        from and carries `values` instead: its format is the mapping from the
        file's own words to the enum constants, `KEY=text;KEY2=other`.
      parameters:
        - name: filename
          in: query
          required: true
          description: The name of the uploaded file; must end in `.csv`.
          schema:
            type: string
        - name: delimiter
          in: query
          required: false
          description: |
            The character the columns are separated by: a comma, a semicolon
            or a tab, and nothing else. Write it as the character itself (the
            one-character spelling a `createImport` mapping's own `delimiter`
            uses), or by name, which is what a tab is for, since a tab has to
            be written `%09` in a query string and is invisible in anything it
            is printed into afterwards. Anything else is refused rather than
            replaced with a default: a file read with the wrong delimiter does
            not fail, it yields one column.

            Defaults to the server JVM locale's list separator, which is a
            comma or a semicolon depending on where the server happens to run.
          schema:
            type: string
            enum: [",", ";", "\t", comma, semicolon, tab]
        - name: encoding
          in: query
          required: false
          description: |
            The charset to read the file in, by name (`UTF-8`,
            `windows-1252`, `ISO-8859-1`). A charset this server's JVM does
            not provide is refused, for the reason `createImport`'s
            `mapping.encoding` is: reading in the wrong charset does not fail,
            it produces mojibake, so a silent substitution would be invisible.

            Defaults to the server's platform default charset.
          schema:
            type: string
        - name: skipLines
          in: query
          required: false
          description: |
            How many lines to discard before the header, for a file that opens
            with a preamble. Must not be negative.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: isFirstLineHeader
          in: query
          required: false
          description: |
            Whether the first line read (after `skipLines`) names the columns.
            When `false`, `columns` are labeled positionally and every line is
            data, which also means `guesses` has no header to match and so
            resolves nothing.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The parsed columns, sample rows and available target fields.
          content:
            application/json:
              schema:
                type: object
                required: [columns, sampleRows, targets]
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      required: [index, label]
                      properties:
                        index:
                          type: integer
                        label:
                          type: string
                  sampleRows:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  targets:
                    type: array
                    items:
                      type: object
                      required: [target, fields, guesses]
                      properties:
                        target:
                          type: string
                          enum:
                            - account-transaction
                            - portfolio-transaction
                            - investment-vehicle
                            - investment-vehicle-price
                            - portfolio
                        guesses:
                          type: array
                          description: |
                            The mapping the application itself would
                            auto-detect for this target — one entry per column
                            of the file, in file order. `field` is the field
                            code the column's header matched, `format` the
                            format guessed for it from the column's own first
                            non-empty value; either is `null` where there is
                            nothing to say. Matching folds umlauts and
                            whitespace and knows each field's several names
                            (`Quote`, `Schluss`, `Schlusskurs`, `Close`), so a
                            client cannot reproduce it and should offer it as a
                            filled-in mapping to correct rather than start from
                            an empty one.
                          items:
                            type: object
                            required: [column, field, format]
                            properties:
                              column:
                                type: integer
                                description: The index in `columns`.
                              field:
                                type: string
                                nullable: true
                              format:
                                type: string
                                nullable: true
                        fields:
                          type: array
                          items:
                            type: object
                            required: [code, name, optional, type, formats]
                            properties:
                              code:
                                type: string
                                description: |
                                  The stable field code a mapping's
                                  `columns[].field` names. Not translated.
                              name:
                                type: string
                                description: The localized display name. Never an identifier.
                              optional:
                                type: boolean
                              type:
                                type: string
                                description: |
                                  What kind of value the field holds, derived
                                  from the field itself rather than from a
                                  table of codes the client would have to keep
                                  in step. `enum` is the one that also carries
                                  `values`.
                                enum: [text, date, amount, enum, isin]
                              formats:
                                type: array
                                description: |
                                  The formats this field accepts, each as the
                                  `code` a mapping's `columns[].format` carries
                                  and the `label` the application shows for it
                                  — a code like `dd.MM.yy` is a pattern, not
                                  something to put in front of a person. Empty
                                  for a field with no choice to make, including
                                  every `enum` field, whose format is the value
                                  mapping described under `values`.
                                items:
                                  type: object
                                  required: [code, label]
                                  properties:
                                    code:
                                      type: string
                                    label:
                                      type: string
                              values:
                                type: array
                                description: |
                                  Present on an `enum` field only. The constants
                                  the column can be mapped to: `key` is the
                                  stable enum constant name, `label` the
                                  localized text the application shows. An enum
                                  column's `format` in a mapping is the
                                  file's own words written against these keys,
                                  `KEY=text;KEY2=other` — the same shape every
                                  bundled configuration uses. Import also
                                  accepts a value that is literally the `key`,
                                  so a column already written as `BUY`/`SELL`
                                  needs no `format` at all.
                                items:
                                  type: object
                                  required: [key, label]
                                  properties:
                                    key:
                                      type: string
                                    label:
                                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/imports/configs:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listImportConfigs
      tags: [Imports]
      summary: List the saved CSV import configurations
      description: |
        The configurations a `.csv` upload's `config` parameter may name, each
        naming the extractor it feeds (`account-transaction`,
        `portfolio-transaction`, `investment-vehicle`,
        `investment-vehicle-price` or `portfolio`). Includes both the
        configurations bundled with the application and any saved with
        `save=true` on a `createImport` `mapping`; see `createImport`'s
        description for both.
      responses:
        "200":
          description: The available configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [label, target]
                  properties:
                    label:
                      type: string
                    target:
                      type: string
                      enum:
                        - account-transaction
                        - portfolio-transaction
                        - investment-vehicle
                        - investment-vehicle-price
                        - portfolio
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/imports/{id}:
    parameters:
      - $ref: "#/components/parameters/File"
      - name: id
        in: path
        required: true
        description: The extraction session's id.
        schema:
          type: string
    get:
      operationId: getImport
      tags: [Imports]
      summary: Read an extraction preview again
      description: |
        The same preview the upload returned, with the checks re-run against the
        file as it is now — a transaction imported in the meantime turns another
        item into a duplicate, and the review should say so.

        A session belonging to a different file is reported `404`, not `403`:
        the two are indistinguishable to a caller that should not hold the id,
        and saying which would confirm the session exists.
      responses:
        "200":
          description: The extraction, to review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: applyImport
      tags: [Imports]
      summary: Apply selected items of an extraction
      description: |
        Books the selected items into the named accounts. The caller names an
        account **per currency** — an item is booked into an account of its own
        currency, and the preview lists the currencies its items need under
        `requiredCurrencies` — plus one investment account for anything holding
        a position.

        Nothing is applied unless every index is valid and every account needed
        was named: a half-applied import would leave the file in a state nobody
        chose. The session is discarded once applied, so a replay is a `404`
        rather than a second import.

        An `investment-vehicle-price` extraction is the one exception to all of
        that, because its items are not transactions: they are quotes with no
        instrument of their own. It needs no accounts and takes `security`
        instead, the instrument its prices are merged into, and answers with
        `pricesAdded` alongside `imported`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportApply"
      responses:
        "200":
          description: What was imported.
          content:
            application/json:
              schema:
                type: object
                required: [imported, instrumentsCreated]
                properties:
                  imported:
                    type: integer
                  instrumentsCreated:
                    type: integer
                  pricesAdded:
                    type: integer
                    description: |
                      Present for an `investment-vehicle-price` import only: how
                      many prices the named instrument actually gained or had
                      replaced. `imported` counts items, and such an extraction
                      is a single item however many prices it carries.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/holdings:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: listHoldings
      tags: [Holdings]
      summary: List the file's holdings, valued at a date
      description: |
        Every holding — instrument positions and cash account balances uniformly —
        valued at the given date in the reporting currency. Instrument positions
        with zero shares at the date are omitted; cash accounts always appear,
        even with a zero balance. Items are sorted by name.

        Beyond the point-in-time valuation, each instrument position is also
        enriched with metrics over `(openingDate, date]` — cost basis, returns,
        dividends, and more. `openingDate` defaults to "since inception": the
        file's earliest transaction (across every account and investment
        account, not only this instrument's own) — an empty period for a file
        with none yet.
      parameters:
        - name: date
          in: query
          required: false
          description: |
            The valuation date (default: today). Each instrument is valued with
            the latest price on or before this date; the holding's `price.date`
            makes the staleness visible. Future dates are allowed and value at
            the last known prices. Also the closing date of the
            `(openingDate, date]` period the enrichment metrics are computed
            over.
          schema:
            type: string
            format: date
        - name: openingDate
          in: query
          required: false
          description: |
            The opening date of the period the enrichment metrics (cost basis,
            returns, dividends, ...) are computed over (default: since
            inception). Must be before `date`; an empty or inverted range is
            rejected `400 invalid-range`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used for `purchasePrice`, `purchaseValue` and
            the related returns (default: `fifo`).
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
        - $ref: "#/components/parameters/InvestmentAccountScope"
      responses:
        "200":
          description: The holdings at the valuation date
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [date, reportingCurrency, totalAssets, items]
                properties:
                  date:
                    type: string
                    format: date
                    description: The effective valuation date.
                  reportingCurrency:
                    type: string
                    description: |
                      The currency every amount in this report has been converted
                      into — the `reportingCurrency` query parameter, or the
                      file's base currency. Not to be confused with a
                      `MonetaryValue`'s `currency` (one amount) or an entity's
                      `currencyCode` (its own declared currency).
                  investmentAccount:
                    type: object
                    description: |
                      Present when the request was scoped with `investmentAccount`.
                      A scoped report lists instrument positions only.
                    required: [uuid, name, type]
                    properties:
                      uuid:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                        description: Always `investment-account`.
                  totalAssets:
                    $ref: "#/components/schemas/MonetaryValue"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holding"
              examples:
                default:
                  value:
                    date: "2026-07-20"
                    reportingCurrency: EUR
                    totalAssets: { value: 1600, currency: EUR }
                    items:
                      - type: instrument
                        uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                        name: Apple Inc.
                        shares: 10
                        price: { value: 110.5, currency: USD, date: "2026-07-17" }
                        valuation: { value: 1100, currency: EUR }
                        localValuation: { value: 1105, currency: USD }
                        weight: 0.6875
                      - type: cash-account
                        uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                        name: Broker Cash
                        valuation: { value: 500, currency: EUR }
                        weight: 0.3125
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getPerformance
      tags: [Performance]
      summary: Performance of the file between two valuation dates
      description: |
        The portfolio's performance between the opening and closing valuation
        dates, in the reporting currency: the time-weighted return (TTWROR) and
        the money-weighted return (IRR), plus the value-change `breakdown` that
        reconciles the opening to the closing value.

        The breakdown is a signed decomposition — the money fields add up to the
        closing value:
        `openingValue + unrealizedCapitalGains + realizedCapitalGains + income +
        fees + taxes + currencyGains + netDeposits = closingValue`. `fees` and
        `taxes` are therefore negative. `netDeposits` is the external capital
        flow (deposits less removals) over the period; it is *not* part of the
        performance-driven change, but is required for the value reconciliation.

        `costMethod` chooses how a security's gains split into realized and
        unrealized; it does not affect their sum, nor the returns.

        `openingDate` and `closingDate` are **valuation snapshot dates, not a
        record range**. The opening balance is measured as of the end of
        `openingDate`, so an activity dated exactly on `openingDate` belongs to
        the opening balance, not the period's flows; an activity on
        `closingDate` is in the period. (A record-selection endpoint such as a
        future transactions list uses an inclusive `[from, to]` range instead —
        the two conventions are named differently on purpose.) A cash flow on
        `closingDate` also weighs on `ttwror` as opening capital does, as the
        time-weighted return has no sub-period after the final day to neutralise
        it against.
      parameters:
        - name: openingDate
          in: query
          required: true
          description: |
            The opening valuation date. `openingValue` equals
            `GET .../holdings?date={openingDate}`'s `totalAssets`.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). `closingValue` equals
            `GET .../holdings?date={closingDate}`'s `totalAssets`. Must be
            strictly after `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used to split capital gains into realized and
            unrealized (default: `fifo`). Echoed in the response.
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
        - $ref: "#/components/parameters/InvestmentAccountScope"
      responses:
        "200":
          description: The performance over the interval
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    reportingCurrency: EUR
                    costMethod: fifo
                    ttwror: 0.0723
                    irr: 0.0685
                    breakdown:
                      openingValue: { value: 100000, currency: EUR }
                      unrealizedCapitalGains: { value: 4200, currency: EUR }
                      realizedCapitalGains: { value: 1500, currency: EUR }
                      income: { value: 900, currency: EUR }
                      fees: { value: -120, currency: EUR }
                      taxes: { value: -300, currency: EUR }
                      currencyGains: { value: 210, currency: EUR }
                      netDeposits: { value: 5000, currency: EUR }
                      closingValue: { value: 111390, currency: EUR }
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/instruments:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listInstrumentPerformance
      tags: [Performance]
      summary: The performance report, broken down by instrument
      description: |
        Per-instrument return, valuation, gains, income, expenses and risk over
        the same interval the aggregate `GET .../performance` covers, in the
        reporting currency. Items are sorted by name.

        **Which instruments appear.** Every instrument the interval touched:
        any transaction inside it, or a non-zero position at either end. A
        position sold during the period therefore stays in, with `shares: 0` and
        a zero `closingValue` but real `realizedCapitalGains`, dividends and
        fees — dropping it would silently erase part of the period's
        performance. An instrument never held and never traded does not appear.

        **Cost.** `timeWeighted` and `risk` are backed by a full daily valuation
        series per instrument; every other group is a cheap linear pass. Use
        `?metrics=` to leave that series unbuilt. Asking for `timeWeighted` and
        `risk` together costs no more than asking for either, as they share one
        series. A request for all groups over every instrument of a large file
        with a long interval is slow; there is no pagination.

        **Signs.** Every money field here is a magnitude: `fees` is the sum of
        the fees charged and is positive. Only fields that are terms of a
        reconciling sum are signed, which is why the aggregate endpoint's
        `breakdown.fees` is negative and this one is not — that breakdown has to
        add up by plain addition, and this resource publishes no such sum.

        `openingDate` and `closingDate` are valuation snapshot dates, not a
        record range, exactly as on the aggregate endpoint.
      parameters:
        - $ref: "#/components/parameters/OpeningDate"
        - $ref: "#/components/parameters/ClosingDate"
        - $ref: "#/components/parameters/ReportingCurrency"
        - $ref: "#/components/parameters/InstrumentCostMethod"
        - $ref: "#/components/parameters/TaxesAndFees"
        - $ref: "#/components/parameters/Metrics"
      responses:
        "200":
          description: The per-instrument performance over the interval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InstrumentPerformanceContext"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/InstrumentPerformance"
              examples:
                default:
                  value:
                    openingDate: "2025-01-01"
                    closingDate: "2025-12-31"
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    metrics:
                      [valuation, gains, income, expenses, moneyWeighted, timeWeighted, risk]
                    items:
                      - uuid: 5c1a0b7e-3d4f-4a2b-9c8e-1f0a2b3c4d5e
                        name: iShares Core MSCI World
                        currencyCode: USD
                        valuation:
                          shares: 152.5
                          openingValue: { value: 15200, currency: EUR }
                          closingValue: { value: 18432.1, currency: EUR }
                          periodCostBasis: { value: 16218.9, currency: EUR }
                        gains:
                          realizedCapitalGains: { value: 0, currency: EUR }
                          realizedCurrencyComponent: { value: 0, currency: EUR }
                          unrealizedCapitalGains: { value: 2213.2, currency: EUR }
                          unrealizedCurrencyComponent: { value: 410, currency: EUR }
                        income:
                          dividends: { value: 312.4, currency: EUR }
                          dividendCount: 4
                          lastDividend: "2025-11-14"
                        expenses:
                          fees: { value: 18.9, currency: EUR }
                          taxes: { value: 74.2, currency: EUR }
                        moneyWeighted: { irr: 0.0755 }
                        timeWeighted: { ttwror: 0.0812, ttwrorAnnualized: 0.0395 }
                        risk:
                          volatility: 0.142
                          semiVolatility: 0.098
                          maxDrawdown: 0.231
                          longestDrawdownDays: 412
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/instruments/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getInstrumentPerformance
      tags: [Performance]
      summary: One instrument's performance over the interval
      description: |
        A member lookup of `GET .../performance/instruments`: it returns exactly
        the item the collection would contain, with the item's fields merged
        into the same context object and no `items` array. If the collection
        would not contain the instrument, there is nothing to return, hence the
        two distinct 404s below.

        This route is genuinely cheaper than the collection, but for one reason:
        the daily series behind `timeWeighted` and `risk` is built per
        instrument and on demand, so serializing one instrument leaves the other
        series unbuilt.

        Note that `reportingCurrency` and `currencyCode` sit next to each other
        here and mean different things — see `MonetaryValue.currency`.
      parameters:
        - $ref: "#/components/parameters/OpeningDate"
        - $ref: "#/components/parameters/ClosingDate"
        - $ref: "#/components/parameters/ReportingCurrency"
        - $ref: "#/components/parameters/InstrumentCostMethod"
        - $ref: "#/components/parameters/TaxesAndFees"
        - $ref: "#/components/parameters/Metrics"
      responses:
        "200":
          description: The instrument's performance over the interval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InstrumentPerformanceContext"
                  - $ref: "#/components/schemas/InstrumentPerformance"
              examples:
                default:
                  value:
                    openingDate: "2025-01-01"
                    closingDate: "2025-12-31"
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    metrics: [valuation]
                    uuid: 5c1a0b7e-3d4f-4a2b-9c8e-1f0a2b3c4d5e
                    name: iShares Core MSCI World
                    currencyCode: USD
                    valuation:
                      shares: 152.5
                      openingValue: { value: 15200, currency: EUR }
                      closingValue: { value: 18432.1, currency: EUR }
                      periodCostBasis: { value: 16218.9, currency: EUR }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Either the file or the instrument is unknown (`not-found`), or the
            instrument exists but the interval contains nothing of it —
            `no-activity-in-period`. The two call for different client
            behaviour: correct the id, versus report that nothing was held.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/trades:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listTrades
      tags: [Trades]
      summary: List the file's trades
      description: |
        Every trade in the file, across all instruments and securities
        accounts. Sorted by instrument name; the trades of one instrument keep
        the order they were matched in, which is chronological.

        A trade is a set of purchases matched against the sales that closed
        them. It is **computed, not stored**: it has no identity that survives
        the next call, it cannot be created, changed or deleted through this
        API, and there is no `/trades/{id}`. To change a trade, change the
        transactions behind it. Address a trade by the filter that produced it.

        Lot matching is always FIFO; `grouping` decides how the matched lots
        are gathered into trades, it does not select a matching strategy.

        An **open** trade has no `end`. Its `exitValue`, `profitLoss` and
        `return` are a valuation at the market price of `valuationDate` rather
        than a realized result, and its `holdingPeriodDays` runs until that
        date — so two calls on different days legitimately return different
        numbers for the same trade. Use `status` to tell the two kinds apart,
        and `direction`: for a short trade profit is entry minus exit, and the
        share count is positive either way.

        A security whose transactions do not reconcile — a sale covering more
        shares than were held, a transfer of shares that are not there — is
        reported in `warnings` and contributes no trades. Note a sale into an
        account holding nothing is *not* such a case: it opens a short
        position, reported as an open trade with `direction: short`. The request still
        succeeds: one unreconcilable security, which an import can leave
        behind, must not make the resource unreadable. **A client that ignores
        `warnings` will read a partial list as a complete one.**
      parameters:
        - $ref: "#/components/parameters/TradeStatus"
        - $ref: "#/components/parameters/TradeGrouping"
        - $ref: "#/components/parameters/TradeCostMethod"
        - $ref: "#/components/parameters/TradeTaxesAndFees"
        - $ref: "#/components/parameters/ReportingCurrency"
      responses:
        "200":
          description: The file's trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradesResponse"
              examples:
                default:
                  value:
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    grouping: combined
                    valuationDate: "2026-08-27"
                    status: [open, closed]
                    warnings: []
                    items:
                      - status: closed
                        direction: long
                        instrument:
                          uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                          name: Apple Inc.
                          currencyCode: USD
                        investmentAccount:
                          uuid: 1d3f5a7c-9e0b-4c2d-8f6a-3b5d7e9f1a2c
                          name: Broker Depot
                        start: "2024-03-04T00:00:00"
                        end: "2025-11-18T00:00:00"
                        shares: 10
                        transactionCount: 2
                        entryValue: { value: 1010.5, currency: EUR }
                        exitValue: { value: 1320, currency: EUR }
                        profitLoss: { value: 309.5, currency: EUR }
                        holdingPeriodDays: 624
                        irr: 0.1782
                        return: 0.3063
                        note: rebalancing
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/{uuid}/trades:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: listInstrumentTrades
      tags: [Trades]
      summary: List one instrument's trades
      description: |
        The trades of a single instrument — a sub-collection of the
        instrument, filtered exactly as `GET .../trades` is.

        An instrument that exists but was never traded has an **empty** list of
        trades, not no list: this returns `200` with `items: []`, not a `404`.
        That differs from `GET .../performance/instruments/{uuid}`, which does
        404, because there the uuid identifies the single item the response
        consists of, while here it identifies the instrument the collection
        belongs to. A `404` from this route means the instrument is unknown.

        A trade is a set of purchases matched against the sales that closed
        them. It is **computed, not stored**: it has no identity that survives
        the next call, it cannot be created, changed or deleted through this
        API, and there is no `/trades/{id}`. To change a trade, change the
        transactions behind it. Address a trade by the filter that produced it.

        Lot matching is always FIFO; `grouping` decides how the matched lots
        are gathered into trades, it does not select a matching strategy.

        An **open** trade has no `end`. Its `exitValue`, `profitLoss` and
        `return` are a valuation at the market price of `valuationDate` rather
        than a realized result, and its `holdingPeriodDays` runs until that
        date — so two calls on different days legitimately return different
        numbers for the same trade. Use `status` to tell the two kinds apart,
        and `direction`: for a short trade profit is entry minus exit, and the
        share count is positive either way.

        A security whose transactions do not reconcile — a sale covering more
        shares than were held, a transfer of shares that are not there — is
        reported in `warnings` and contributes no trades. Note a sale into an
        account holding nothing is *not* such a case: it opens a short
        position, reported as an open trade with `direction: short`. The request still
        succeeds: one unreconcilable security, which an import can leave
        behind, must not make the resource unreadable. **A client that ignores
        `warnings` will read a partial list as a complete one.**
      parameters:
        - $ref: "#/components/parameters/TradeStatus"
        - $ref: "#/components/parameters/TradeGrouping"
        - $ref: "#/components/parameters/TradeCostMethod"
        - $ref: "#/components/parameters/TradeTaxesAndFees"
        - $ref: "#/components/parameters/ReportingCurrency"
      responses:
        "200":
          description: The instrument's trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradesResponse"
              examples:
                default:
                  value:
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    grouping: combined
                    valuationDate: "2026-08-27"
                    status: [open, closed]
                    warnings: []
                    items:
                      - status: closed
                        direction: long
                        instrument:
                          uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                          name: Apple Inc.
                          currencyCode: USD
                        investmentAccount:
                          uuid: 1d3f5a7c-9e0b-4c2d-8f6a-3b5d7e9f1a2c
                          name: Broker Depot
                        start: "2024-03-04T00:00:00"
                        end: "2025-11-18T00:00:00"
                        shares: 10
                        transactionCount: 2
                        entryValue: { value: 1010.5, currency: EUR }
                        exitValue: { value: 1320, currency: EUR }
                        profitLoss: { value: 309.5, currency: EUR }
                        holdingPeriodDays: 624
                        irr: 0.1782
                        return: 0.3063
                        note: rebalancing
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/series:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getPerformanceSeries
      tags: [Performance]
      summary: Daily performance index and risk metrics for a period
      description: |
        The daily index behind `GET .../performance`: one entry per calendar day
        with the accumulated time-weighted return, total assets, invested
        capital, that day's external flow and the running drawdown — plus the
        `risk` metrics derived from the same series (maximum drawdown and its
        duration, volatility, semi-deviation, and the index's own high water
        mark).

        Amounts in `days` are plain numbers in the response's `currency`, not
        `MonetaryValue` objects: the currency is fixed for the whole series and a
        year is roughly 365 entries.

        `openingDate` and `closingDate` follow the same valuation-snapshot
        convention as `GET .../performance`. `days[0]` is the `openingDate`
        baseline: its `ttwror` is 0 by construction, because the accumulated
        index is rebased to the start of the interval. The series is clamped to
        today, so it can be **shorter** than the requested range when
        `closingDate` is in the future — read the effective range off the
        entries, not off the request.

        The interval must not exceed 20 years (`400 invalid-range`); the
        response holds one entry per calendar day.

        There is no `costMethod` parameter: none of these figures depend on how
        gains split into realized and unrealized.
      parameters:
        - name: openingDate
          in: query
          required: true
          description: The opening valuation date, and the index's rebase point.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). Must be strictly after
            `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
        - $ref: "#/components/parameters/InvestmentAccountScope"
      responses:
        "200":
          description: The daily index and its risk metrics
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceSeries"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    risk:
                      maxDrawdown: -0.183
                      maxDrawdownPeak: "2024-02-19"
                      maxDrawdownTrough: "2024-04-07"
                      maxDrawdownDurationDays: 121
                      maxDrawdownDurationStart: "2024-02-19"
                      maxDrawdownDurationEnd: "2024-06-19"
                      volatility: 0.142
                      semiDeviation: 0.101
                      riskFreeRate: 0.02
                      sharpeRatio: 1.021
                      allTimeHigh:
                        value: 0.31
                        date: "2024-11-14"
                        distance: -0.04
                    days:
                      - date: "2024-01-01"
                        ttwror: 0
                        totalAssets: 100000
                        investedCapital: 100000
                        netDeposits: 0
                        drawdown: 0
                      - date: "2024-01-02"
                        ttwror: 0.0031
                        totalAssets: 100310
                        investedCapital: 100000
                        netDeposits: 0
                        drawdown: 0
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/securities:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getSecurityPerformance
      tags: [Performance]
      summary: Per-security performance over a period
      description: |
        How each security contributed over the period, in the reporting currency.

        This covers **every security with activity in the interval, including
        positions closed before `closingDate`** — which is what distinguishes it
        from `GET .../holdings?date={closingDate}`. A holdings snapshot can only
        report what is still held, so a position sold at a profit mid-period is
        invisible there while often being one of the largest contributors here.
        `heldAtClose` tells the two apart.

        `delta` is the cost-method independent absolute gain (it accounts for
        sells and dividends over the period); `realizedGains` and
        `unrealizedGains` split the capital gains according to `costMethod` and
        are the two figures that depend on it.
      parameters:
        - name: openingDate
          in: query
          required: true
          description: The opening valuation date.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). Must be strictly after
            `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used to split capital gains into realized and
            unrealized (default: `fifo`). It does not affect `delta`, `ttwror` or
            `irr`.
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
      responses:
        "200":
          description: The per-security performance over the interval
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPerformanceCollection"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    items:
                      - uuid: 4e0c0f0a-0000-4000-8000-000000000001
                        name: ACME Corp
                        delta: { value: 1520, currency: EUR }
                        deltaPercent: 0.12
                        ttwror: 0.14
                        irr: 0.13
                        realizedGains: { value: 0, currency: EUR }
                        unrealizedGains: { value: 1450, currency: EUR }
                        dividends: { value: 70, currency: EUR }
                        fees: { value: -3, currency: EUR }
                        taxes: { value: 0, currency: EUR }
                        heldAtClose: true
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/calendar:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getPerformanceCalendar
      tags: [Performance]
      summary: Per-month returns and activity
      description: |
        One entry per calendar month covering the requested period: the month's
        time-weighted return plus the money that moved through it (dividends,
        interest, fees, taxes, net transfers, and buy/sell counts and volumes).

        The monthly return is the application's own figure — one performance index
        over the month-aligned span, sampled per month, exactly as the desktop's
        monthly-returns heat map does it. It is deliberately **not** a compounding
        of `.../performance/series`, which would drift from the desktop.

        The period is widened to whole months: the first entry is the month
        containing `openingDate` and the last is the month containing
        `closingDate`, each covering the entire month even where the request did
        not. `ttwror` is `null` for a month the index does not cover (rather than
        `0`, which would read as a flat month).

        Amounts are plain numbers in the response's `currency`, as in
        `.../performance/series`. `fees` and `taxes` are signed contributions
        (negative), matching the value-change breakdown rather than the model's
        unsigned storage. Each transaction is converted at **its own** date, which
        is why this is an endpoint rather than a client-side sum over
        `.../transactions`: transactions carry their own currencies.
      parameters:
        - name: openingDate
          in: query
          required: true
          description: Any date in the first month to report.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            Any date in the last month to report (default: today). Must be
            strictly after `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
      responses:
        "200":
          description: The monthly returns and activity
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceCalendar"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    months:
                      - month: "2024-01"
                        ttwror: 0.021
                        earnings: { dividends: 210, interest: 12.5 }
                        fees: -8
                        taxes: -55
                        netTransfers: 1000
                        trades: { buys: 3, sells: 1, buyVolume: 4500, sellVolume: 900 }
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A per-client access token, obtained through interactive pairing
        (`POST /v1/auth/requests`) or minted manually in Preferences → MCP Server & REST API
        ("Add client"). The user can revoke each client individually; a
        session-scoped token additionally expires when the application quits.

  parameters:
    File:
      name: file
      in: path
      required: true
      description: |
        A file's `id` or `alias`, as returned by `GET /v1/files`. An alias that
        matches several records is rejected `409 ambiguous-alias`; use the `id`.
      schema:
        type: string
    Uuid:
      name: uuid
      in: path
      required: true
      description: The `uuid` of the entity within the file
      schema:
        type: string
    OpeningDate:
      name: openingDate
      in: query
      required: true
      description: |
        The opening valuation date. An activity dated exactly on it belongs to
        the opening balance, not to the period.
      schema:
        type: string
        format: date
    ClosingDate:
      name: closingDate
      in: query
      required: false
      description: |
        The closing valuation date (default: today). Must be strictly after
        `openingDate`; an empty or inverted range is rejected `400
        invalid-range`. Future dates are accepted and value at the last known
        prices.
      schema:
        type: string
        format: date
    ReportingCurrency:
      name: reportingCurrency
      in: query
      required: false
      description: |
        The currency the whole report is expressed in (default: the file's base
        currency). A currency pair without an exchange rate series converts 1:1
        — the same silent fallback the application itself applies.

        Request and response name this concept identically, so a client can send
        back what it read. The two other currency concepts keep their own names:
        a `MonetaryValue`'s `currency` is what one amount is expressed in, and an
        entity's `currencyCode` is its own declared currency.
      schema:
        type: string
    InvestmentAccountScope:
      name: investmentAccount
      in: query
      required: false
      description: |
        The uuid of an investment account. The calculation then covers only that
        account's instruments: a purchase counts as a delivery into the account
        and the cash it settled against is out of scope, so the totals equal the
        account's `value` in `GET .../investment-accounts`. "Since inception"
        becomes the account's own first transaction, and the account is echoed
        as `investmentAccount` in the response. An unknown uuid is rejected
        `400 unknown-reference` on `investmentAccount`.
      schema:
        type: string
        format: uuid
    InstrumentCostMethod:
      name: costMethod
      in: query
      required: false
      description: |
        The cost basis method (default: `fifo`). It shifts the split between
        realized and unrealized gains and the `periodCostBasis` that goes with
        them; it does not affect `closingValue`, `ttwror` or `irr`. Echoed in
        the response.
      schema:
        type: string
        enum: [fifo, moving-average]
        default: fifo
    TaxesAndFees:
      name: taxesAndFees
      in: query
      required: false
      description: |
        Whether the taxes and fees embedded in a trade are part of the cost
        basis (default: `included`). It applies to `periodCostBasis` and to the
        capital gains figures **together**, so that the two stay comparable.

        It does *not* change `expenses.fees` and `expenses.taxes`, which always
        report the charges themselves, nor any return ratio. Echoed in the
        response.
      schema:
        type: string
        enum: [included, excluded]
        default: included
    Metrics:
      name: metrics
      in: query
      required: false
      description: |
        A comma-separated selection of metric groups (default: all seven). An
        unselected group is an absent key in each item; a selected group keeps
        the exact meaning it has when every group is requested — this projects a
        fixed schema, it does not compose one.

        Selection is by group because the cost boundary is a group boundary:
        `timeWeighted` and `risk` are backed by a daily valuation series per
        instrument and dominate the cost of a request, while the other five are
        cheap linear passes. An unknown group name is rejected `400
        invalid-value`. Echoed in the response.
      schema:
        type: array
        items:
          type: string
          enum:
            [valuation, gains, income, expenses, moneyWeighted, timeWeighted, risk]
      style: form
      explode: false
    TradeStatus:
      name: status
      in: query
      required: false
      description: |
        Which trades to return (default: both). A comma-separated list of
        `open` and `closed`. Echoed in the response as an array, in the order
        above rather than the order sent.
      schema:
        type: array
        items:
          type: string
          enum: [open, closed]
        default: [open, closed]
      style: form
      explode: false
    TradeGrouping:
      name: grouping
      in: query
      required: false
      description: |
        How matched lots are gathered into trades (default: `combined`).
        `combined` makes one trade out of the acquisitions that a sale closed;
        `per-lot` reports each acquisition as its own trade.

        This is **not** a lot matching strategy — matching is always FIFO and
        cannot be changed. An unknown value is rejected rather than silently
        treated as `combined`. Echoed in the response.
      schema:
        type: string
        enum: [combined, per-lot]
        default: combined
    TradeCostMethod:
      name: costMethod
      in: query
      required: false
      description: |
        The cost basis method (default: `fifo`). It changes `entryValue`,
        `profitLoss` and `return`, which are then computed against the moving
        average cost of the shares rather than the matched lots.

        It does **not** change `irr`, which is derived from the actual cash
        flows and has no moving-average counterpart — so a request with
        `moving-average` returns a deliberately mixed-basis item. Nor does it
        change `exitValue`, which is what the shares realized or are worth.

        `entryValue`, `profitLoss` and `return` are `null` — always all three
        together — for a trade whose moving average cost is undefined. That is
        the case for every **short** trade, which was never acquired and so has
        no acquisition cost, and for a trade no performance record backs.
        `exitValue` and `irr` stay defined. Echoed in the response.
      schema:
        type: string
        enum: [fifo, moving-average]
        default: fifo
    TradeTaxesAndFees:
      name: taxesAndFees
      in: query
      required: false
      description: |
        Whether the taxes and fees of the trade's own transactions are part of
        its values (default: `included`). It moves `entryValue`, `exitValue`
        and `profitLoss` **together**, so that
        `profitLoss = exitValue - entryValue` keeps holding for a long trade
        (and `entryValue - exitValue` for a short one).

        It does not change `irr` or `return`, matching the rule the performance
        resource states. It has no effect on the exit side of an **open**
        trade: that is a valuation at the market price, on which no charges
        have been incurred. Echoed in the response.
      schema:
        type: string
        enum: [included, excluded]
        default: included
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        The `ETag` of the representation you already hold. If it still applies,
        the answer is `304` with no body — and the server skips the computation,
        not just the transfer. A comma-separated list and `*` are accepted.
      schema:
        type: string

    Taxonomy:
      name: taxonomy
      in: path
      required: true
      description: The `id` of the taxonomy, as reported by the taxonomy list
      schema:
        type: string

    Category:
      name: category
      in: path
      required: true
      description: |
        The `id` of a category within the taxonomy. The taxonomy's root is not
        addressable — it names the taxonomy, not a category.
      schema:
        type: string

  schemas:
    TradesResponse:
      type: object
      description: |
        The trades matching the request, with the parameters they were computed
        with echoed back and the securities that could not be reconciled.
      required:
        [
          reportingCurrency,
          costMethod,
          taxesAndFees,
          grouping,
          valuationDate,
          status,
          warnings,
          items,
        ]
      properties:
        reportingCurrency:
          type: string
          description: |
            The currency every amount in this response has been converted into
            — the `reportingCurrency` query parameter, or the file's base
            currency. Not to be confused with a `MonetaryValue`'s `currency`
            (one amount) or an instrument's `currencyCode` (its own declared
            currency).
        costMethod:
          type: string
          enum: [fifo, moving-average]
        taxesAndFees:
          type: string
          enum: [included, excluded]
        grouping:
          type: string
          enum: [combined, per-lot]
        valuationDate:
          type: string
          format: date
          description: |
            The date the open trades were valued at, and the date their holding
            period runs to. Closed trades do not depend on it.
        status:
          type: array
          description: The selected statuses, in declaration order.
          items:
            type: string
            enum: [open, closed]
        warnings:
          type: array
          description: |
            The securities the collector could not reconcile, each contributing
            no trades to `items`. Always present, empty when nothing failed —
            a client must be able to tell "nothing went wrong" from "this
            endpoint cannot report problems".
          items:
            $ref: "#/components/schemas/TradeWarning"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trade"

    TradeWarning:
      type: object
      description: |
        One security whose transactions do not add up, and which therefore
        contributes no trades. The message is English regardless of the
        application's language.
      required: [instrument, code, message]
      properties:
        instrument:
          $ref: "#/components/schemas/InstrumentReference"
        code:
          type: string
          description: |
            Why the collector gave up on this security.

            **Open set:** new codes may be added within v1. Whatever the code,
            the instrument contributed no trades; `message` says why.
          x-extensible-enum:
            [
              no-holdings-for-sell,
              missing-holdings-for-sell,
              no-holdings-for-transfer,
              missing-holdings-for-transfer,
            ]
        message:
          type: string

    InstrumentReference:
      type: object
      description: |
        A pointer to an instrument. Join to `GET .../instruments/{uuid}` by
        `uuid`; the ISIN, WKN and ticker are deliberately not repeated here.
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: [string, "null"]
          description: |
            The instrument's own declared currency, or `null` for a
            currency-less instrument such as an index or a CPI series. The key
            is **always present** (hence `required`); only its value may be
            null — the same rule as on `Instrument`.

    InvestmentAccountReference:
      type: object
      description: |
        A pointer to an investment account. Join to
        `GET .../investment-accounts/{uuid}` by `uuid`.
      required: [uuid, name]
      properties:
        uuid:
          type: string
        name:
          type: string

    Trade:
      type: object
      description: |
        One set of purchases matched against the sales that closed them. Has no
        id: a trade is recomputed on every request and its identity would not
        survive `grouping` changing or a transaction being edited.
      required:
        [
          status,
          direction,
          instrument,
          investmentAccount,
          start,
          end,
          shares,
          transactionCount,
          entryValue,
          exitValue,
          profitLoss,
          holdingPeriodDays,
          irr,
          return,
        ]
      properties:
        status:
          type: string
          enum: [open, closed]
          description: |
            `closed` when the shares have been fully sold. An `open` trade has
            a null `end`, and its exit-side values are a valuation rather than
            a realized result.
        direction:
          type: string
          enum: [long, short]
          description: |
            `long` when the trade opened with a purchase. For a `short` trade
            `profitLoss` is entry minus exit, the reverse of a long one — and
            `shares` is positive in both cases, so this cannot be inferred from
            the other fields.
        instrument:
          $ref: "#/components/schemas/InstrumentReference"
        investmentAccount:
          $ref: "#/components/schemas/InvestmentAccountReference"
        start:
          type: string
          description: |
            When the trade was opened, as a **local** date and time in
            `YYYY-MM-DDTHH:MM:SS` — always with seconds, and deliberately
            without a UTC offset: the model records no timezone, and adding the
            server's would attribute one the file may not have been kept in.
            Not an RFC 3339 `date-time` for that reason.
        end:
          type: [string, "null"]
          description: |
            When the trade was closed, in the same format as `start`; `null`
            while the trade is open.
        shares:
          type: number
          description: The number of shares the trade covers, always positive.
        transactionCount:
          type: integer
          description: |
            How many transactions the trade was matched from — 2 for a clean
            buy and sell, more for an accumulated or partially sold position.
        entryValue:
          oneOf:
            - $ref: "#/components/schemas/MonetaryValue"
            - type: "null"
          description: |
            What acquiring the shares cost. Follows `costMethod` and
            `taxesAndFees`. `null` when `costMethod=moving-average` and the
            moving average cost is undefined for this trade — in particular for
            every `short` trade, which was never acquired. `profitLoss` and
            `return` are `null` whenever this is.
        exitValue:
          $ref: "#/components/schemas/MonetaryValue"
          description: |
            What selling the shares realized, or — for an open trade — what
            they are worth at `valuationDate`. Follows `taxesAndFees` for a
            closed trade; an open trade has incurred no charges. Does not
            follow `costMethod`.
        profitLoss:
          oneOf:
            - $ref: "#/components/schemas/MonetaryValue"
            - type: "null"
          description: |
            `exitValue - entryValue` for a long trade, the reverse for a
            short one — so check `direction` before subtracting the two
            yourself. Signed: it is a term of that reconciling difference.
            Follows `costMethod` and `taxesAndFees`, and is `null` under
            exactly the same condition as `entryValue`.
        holdingPeriodDays:
          type: integer
          description: |
            The share-weighted average number of days the shares were held,
            counted to `end` or, for an open trade, to `valuationDate`.
        irr:
          type: [number, "null"]
          description: |
            The internal rate of return as a fraction (0.0523 is 5.23 %),
            annualized, from the trade's actual cash flows. Does **not** follow
            `costMethod` or `taxesAndFees` — there is no variant of it. `null`
            when the model cannot define it.
        return:
          type: [number, "null"]
          description: |
            The total return as a fraction (0.0523 is 5.23 %), not annualized.
            Follows `costMethod` but not `taxesAndFees`. `null` when the model
            cannot define it, and always when `entryValue` is.
        note:
          type: string
          description: The note on the trade's last transaction, when it has one.

    File:
      type: object
      description: An open, enabled portfolio file you may address.
      required: [id, label, path, changeId, dirty]
      properties:
        id:
          type: string
          description: |
            Stable identity of the file, keyed by path. Address the file by this or
            by `alias`.
        alias:
          type: string
          description: Optional human-friendly handle the user assigned to the file.
        label:
          type: string
          description: The file's display label in the application.
        path:
          type: string
          description: |
            The file's path on disk. Identity is keyed by path, so a *different*
            file copied over an enabled path inherits that path's access.
        changeId:
          type: integer
          format: int64
          description: |
            A counter that grows with every change to the file's model. Compare it
            with the one you saw last to learn whether the data moved — including
            edits the user made in the desktop application, which a client has no
            other way to notice. **Only equality is meaningful**: it is not a count
            of edits, not ordered against other files, and it starts over when the
            application restarts, so never persist it across a session.
        dirty:
          type: boolean
          description: |
            Whether the file holds changes the user has not saved. Writes through
            this API set it, exactly as an edit in the UI does; only the user
            clears it by saving.

    PairingRequestCreated:
      type: object
      description: A filed access request, awaiting the user's decision.
      required: [id, status]
      properties:
        id:
          type: string
          description: Poll `GET /v1/auth/requests/{id}` with this.
        status:
          type: string
          const: pending

    PairingRequestStatus:
      type: object
      description: The state of an access request.
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, expired]
        token:
          type: string
          description: |
            The bearer token; present only while `status` is `approved`, and
            delivered exactly once.

    Instrument:
      type: object
      description: A security — stock, fund, bond, crypto, …
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: [string, "null"]
          description: |
            ISO 4217 currency code, or `null` for a currency-less instrument such
            as an index or a CPI series. The key is **always present** (hence
            `required`); only its value may be null.
        isin:
          type: string
          description: Omitted when not set.
        wkn:
          type: string
          description: Omitted when not set.
        tickerSymbol:
          type: string
          description: Omitted when not set.
        feed:
          type: string
          description: |
            The id of the quote feed the instrument's historical prices come
            from (`YAHOO`, `MANUAL`, …) — the same identifier the file format
            stores. Omitted when none is configured.
        latestFeed:
          type: string
          description: |
            The id of the feed the latest (intraday) quote comes from, when it
            differs from `feed`. Omitted when the historical feed serves both.
        note:
          type: string
          description: Omitted when not set.
        attributes:
          type: object
          description: |
            The instrument's set custom attributes, keyed by attribute id.
            Only attributes that have a value and a supported scalar type
            appear; the key is omitted entirely when none do. Each value is
            typed JSON — a string, number, or boolean (dates are ISO-8601
            strings). Resolve an id to its precise type via
            `GET /v1/files/{file}/instruments/attribute-types`.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    InstrumentPatch:
      type: object
      description: |
        A JSON Merge Patch (RFC 7386) over an instrument. Every field is optional;
        an omitted field is left untouched. Fields typed `["string","null"]` accept
        an explicit `null` to clear them. Custom attributes are patched through the
        nested `attributes` object. Everything else — prices, feed-specific
        configuration, events, the retired flag — is read-only in v1.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Non-empty; cannot be cleared.
        feed:
          type: string
          description: |
            The quote feed for historical prices, by its stable id (`YAHOO`,
            `MANUAL`, …). Must name a feed this build has, or the patch is
            rejected 422 `invalid-value`; it cannot be cleared — `MANUAL` is
            the "no automatic updates" choice. Whether the feed can serve the
            instrument (Yahoo needs a `tickerSymbol`, say) is feed-specific
            and not validated here: a feed that cannot deliver reports the
            instrument on the daemon's refresh failure list.
        latestFeed:
          type: [string, "null"]
          description: |
            The feed for the latest (intraday) quote, by id, or `null` to fall
            back to `feed`.
        currencyCode:
          type: [string, "null"]
          description: |
            A known ISO 4217 currency, or `null` to clear it (marking the
            instrument an index). Clearing is rejected for an exchange rate
            (`exchange-rate-requires-currency`). Any currency change — including
            clearing — is **rejected while the instrument has transactions**
            (`locked-by-transactions`), matching the UI's rule.
        isin:
          type: [string, "null"]
        wkn:
          type: [string, "null"]
        tickerSymbol:
          type: [string, "null"]
        note:
          type: [string, "null"]
        attributes:
          type: object
          description: |
            A nested merge patch over the custom attributes, keyed by attribute
            id: a present value sets the attribute, an explicit `null` clears it,
            an absent id is left untouched. Values are typed JSON per the
            attribute's `type` (see the attribute-types endpoint). Writing an
            unknown id, a non-applicable or compound-typed attribute, or a value
            of the wrong type is rejected with 422 `validation`.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"

    AttributeDefinition:
      type: object
      description: A custom attribute definition applicable to an instrument.
      required: [id, name, type, supported]
      properties:
        id:
          type: string
          description: Stable identifier; the key used in an instrument's `attributes` map.
        name:
          type: string
          description: User-facing name (the desktop UI shows this, not the id).
        columnLabel:
          type: string
          description: Short label; omitted when not set.
        type:
          type: string
          description: |
            The value type. Supported scalars — `string`, `boolean`, `date`
            (ISO-8601), `amount`, `quote`, `shares`, `percent` (a fraction,
            e.g. 0.007 for 0.7%), `number` (an unscaled decimal; where the
            desktop reads such an attribute as a percentage — the expected
            dividends column — 5 means 5%). Compound — `limit-price`,
            `bookmark`, `image` — appear with `supported: false`.

            **Open set:** new types may be added within v1, as the application
            gains them. Treat an unknown type as `supported: false`.
          x-extensible-enum:
            - string
            - boolean
            - date
            - amount
            - quote
            - shares
            - percent
            - number
            - limit-price
            - bookmark
            - image
        supported:
          type: boolean
          description: Whether v1 can read and write this attribute.

    CashAccount:
      type: object
      description: An account holding cash in a single currency.
      required: [uuid, name, currencyCode, balance]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: string
          description: ISO 4217 currency code.
        note:
          type: string
          description: Omitted when not set.
        balance:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The account's running balance at the request's `date`, always in
            `currencyCode` - never converted.

    InvestmentAccount:
      type: object
      description: |
        An account holding instrument positions. Its cash side is a separate cash
        account, named by `referenceCashAccount`.
      required: [uuid, name, value]
      properties:
        uuid:
          type: string
        name:
          type: string
        referenceCashAccount:
          type: string
          description: |
            The `uuid` of the cash account backing this investment account. Omitted
            when not set.
        note:
          type: string
          description: Omitted when not set.
        value:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The total value of every security position this account holds at
            the request's `date`, converted into the request's `currency`.

    MonetaryValue:
      type: object
      description: |
        An amount of money: a plain decimal number (never scientific notation on
        the wire) plus its ISO 4217 currency code.
      required: [value, currency]
      properties:
        value:
          type: number
        currency:
          type: string
          description: |
            The currency of *this amount*. The API keeps three currency concepts
            apart on purpose: `currency` is what one amount is expressed in,
            `reportingCurrency` is what a whole report has been converted into,
            and `currencyCode` is an entity's own declared currency.

    Price:
      type: object
      description: |
        The price per share a valuation is based on: the latest price on or
        before the valuation date — possibly well before it (stale quote, or the
        fallback to the price of the position's last transaction).
      required: [value, currency]
      properties:
        value:
          type: number
        currency:
          type: string
          description: |
            The instrument's own currency. Always set: only held instruments
            have a price here, and the application refuses transactions on an
            instrument without a currency.
        date:
          type: string
          format: date
          description: The date the price is from.

    Taxonomy:
      type: object
      description: |
        One category scheme and its tree. Joins to a holding's `classifications`,
        which is keyed by the `id` here.
      required: [id, name, categories]
      properties:
        id:
          type: string
          description: The key this taxonomy appears under in a holding's `classifications`.
        name:
          type: string
        template:
          type: string
          description: |
            The id of the bundled template this taxonomy was built from
            (`security-type`, `regions`, …), which the application records as the
            root's classification key. **Absent for a taxonomy somebody defined
            themselves**, and that absence is the only thing that tells a hand-built
            scheme apart from the stock ones every file starts with.
        categories:
          type: array
          description: |
            The top-level categories. The taxonomy's own root is not among them —
            it names the taxonomy, not a category.
          items:
            $ref: "#/components/schemas/TaxonomyCategory"

    TaxonomyCategory:
      type: object
      required: [id, name, weight]
      properties:
        id:
          type: string
          description: |
            The category's own identifier, stable across saves. This is the handle
            every write to the tree names a category by.
        name:
          type: string
        color:
          type: string
          description: The category's display color, as set in the application.
        note:
          type: string
          description: The category's note, when it has one.
        weight:
          type: number
          description: |
            The rebalancing target the application stores for this category, as a
            fraction **of the parent category** — the categories under one parent
            are meant to sum to 1, and the application flags it as a weight error
            when they do not. A category created without a target takes whatever
            its siblings leave unclaimed, so the first child of a parent is 1 and
            the next is 0.
        assignments:
          type: array
          description: |
            The instruments and cash accounts assigned to this category. Omitted
            when it has none, rather than reported as an empty array.
          items:
            $ref: "#/components/schemas/TaxonomyAssignment"
        children:
          type: array
          description: Omitted for a leaf, rather than reported as an empty array.
          items:
            $ref: "#/components/schemas/TaxonomyCategory"

    TaxonomyCategoryWrite:
      type: object
      description: |
        The writable facets of a category. `name` is required when creating one;
        everything else takes a default. Any other field is rejected `422` rather
        than silently ignored — a typo must not look like success.
      properties:
        name:
          type: string
        parent:
          type: string
          nullable: true
          description: |
            The id of the category this one sits under. Absent or `null` means the
            top level: the root is the taxonomy, not a category.
        color:
          type: string
          description: A hex triplet such as `#89afee`.
        note:
          type: string
          nullable: true
        weight:
          type: number
          description: |
            The rebalancing target, as a fraction of the parent category. Out of
            range is refused rather than clamped, so a client that meant `40`
            instead of `0.4` hears about it.
        position:
          type: integer
          minimum: 0
          description: |
            The index among the siblings, clamped to the end of the list. Absent
            means last when creating, and unchanged when patching.

    TaxonomyAssignment:
      type: object
      description: |
        One instrument or cash account assigned to a category. A `weight` below 1
        is a split: the remainder sits in another category of the same taxonomy,
        or nowhere at all. What is left over is not reported — the application
        derives "unassigned" from the assignments rather than storing it.
      required: [type, uuid, name, weight]
      properties:
        type:
          type: string
          enum: [instrument, cash-account]
        uuid:
          type: string
        name:
          type: string
        weight:
          type: number
          description: The assigned share of the vehicle, as a fraction between 0 and 1.

    PriceSeries:
      type: object
      description: |
        An instrument's recorded quotes over a range, oldest first. The currency is
        stated once for the whole series rather than on every point: every quote of
        an instrument is in the instrument's currency, and a per-point object would
        multiply the size of a response that is one entry per trading day.
      required: [uuid, items]
      properties:
        uuid:
          type: string
          description: The instrument the series belongs to.
        currency:
          type: string
          description: |
            The instrument's own currency, which every `value` is in. Omitted for
            the rare instrument without a currency.
        from:
          type: string
          format: date
          description: |
            The date of the first point. Absent when the instrument has no prices
            in the requested range.
        to:
          type: string
          format: date
          description: |
            The date of the last point. Absent when the instrument has no prices
            in the requested range.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"

    PricePoint:
      type: object
      description: One recorded quote, per share, in the series' currency.
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number

    BalanceSeries:
      type: object
      description: |
        A cash account's balance at the end of each calendar day of a range,
        oldest first. Shaped like `PriceSeries`: the currency is stated once for
        the whole series, since every balance of an account is in the account's
        own currency.
      required: [uuid, currency, items]
      properties:
        uuid:
          type: string
          description: The cash account the series belongs to.
        currency:
          type: string
          description: The account's own currency, which every `balance` is in.
        from:
          type: string
          format: date
          description: |
            The date of the first point. Absent when the series covers nothing —
            an account with no transactions, or a range ending before its first
            one.
        to:
          type: string
          format: date
          description: |
            The date of the last point. Absent when the series covers nothing.
        items:
          type: array
          items:
            $ref: "#/components/schemas/BalancePoint"

    BalancePoint:
      type: object
      description: |
        One day's closing balance, in the series' currency. Negative when the
        account is overdrawn — a margin debit.
      required: [date, balance]
      properties:
        date:
          type: string
          format: date
        balance:
          type: number

    CostBasis:
      type: object
      description: |
        A cost basis, both gross and net of fees/taxes. "Gross" includes
        fees/taxes in the cost basis (the total economic outlay); "net"
        excludes them — matching the desktop's "purchase price"/"gross
        purchase price" columns.
      required: [gross, net]
      properties:
        gross:
          $ref: "#/components/schemas/MonetaryValue"
        net:
          $ref: "#/components/schemas/MonetaryValue"

    ImportPreview:
      type: object
      description: |
        What an uploaded statement was found to contain, and what each item
        would run into if imported.
      required: [id, fileName, items, requiredCurrencies, errors]
      properties:
        id:
          type: string
          description: The session id, used to read this preview again and to apply it.
        fileName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewItem"
        requiredCurrencies:
          type: array
          description: |
            Every currency the items are denominated in, and therefore every key
            the `accounts` object must carry when applying.
          items:
            type: string
        errors:
          type: array
          description: |
            Extraction failures for the file as a whole — a page that could not be
            parsed, an unrecognised issuer. Distinct from an item's own `checks`.
          items:
            type: string

    ImportPreviewItem:
      type: object
      required: [index, type, status, checks, createsInstrument]
      properties:
        index:
          type: integer
          description: What the apply call selects by. Stable for the life of the session.
        type:
          type: string
          description: |
            The extractor's own label for the item, e.g. "Buy" or "Dividend".
            **Localized** — it is what the desktop wizard shows, in the
            application's language, so display it and never switch on it. The
            machine-readable facts are the other fields.
        status:
          type: string
          description: The worst of this item's checks, which is what a review list sorts on.
          enum: [ok, warning, error, skipped]
        createsInstrument:
          type: boolean
          description: The item *is* a new instrument, which importing would add to the file.
        date:
          type: string
          format: date-time
        amount:
          $ref: "#/components/schemas/MonetaryValue"
        shares:
          type: number
        security:
          type: object
          properties:
            name:
              type: string
            isin:
              type: string
            currency:
              type: string
        source:
          type: string
          description: Where in the statement the item came from.
        failure:
          type: string
          description: Present when the item could not be extracted at all.
        checks:
          type: array
          description: |
            One entry per check that had something to say; a check that passed is
            absent. Reported per check rather than collapsed into one verdict
            because "this is a duplicate" and "this currency matches no account"
            call for different decisions from whoever is reviewing.
          items:
            type: object
            required: [code, severity]
            properties:
              code:
                type: string
                enum:
                  - transaction-date
                  - invalid-type
                  - security-values
                  - duplicate
                  - currency-mismatch
                  - forex-gross-value
              severity:
                type: string
                enum: [warning, error, skipped]
              message:
                type: string

    ImportApply:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          description: The indices of the preview items to import.
          items:
            type: integer
        accounts:
          type: object
          description: |
            The cash account to book into, per currency — the keys are the
            preview's `requiredCurrencies`, and an account whose currency does
            not match its key is rejected `currency-mismatch`.
          additionalProperties:
            type: string
        portfolio:
          type: string
          description: UUID of the investment account for items that hold a position.
        security:
          type: string
          description: |
            UUID of the instrument an `investment-vehicle-price` extraction's
            prices belong to. **Required** for that target and rejected
            `not-applicable` for every other, where the items name their own
            instruments. The extractor produces prices with no instrument of
            their own — a nameless placeholder that exists only to carry them —
            so this is the same choice the desktop wizard puts on its own
            "select security" page for this one target. Prices are merged, not
            appended: one already on record for the same date is replaced, so
            re-applying an overlapping range changes nothing.
        convertBuySellToDelivery:
          type: boolean
          description: |
            Book purchases and sales as deliveries instead, for a statement whose
            cash side is already recorded elsewhere.
        skipDividends:
          type: boolean
          description: Leave dividend items out, for a statement whose dividends are recorded elsewhere.
        importNotesFromSource:
          type: boolean
          default: true
          description: |
            Keep the note the extractor read out of the statement (an order
            reference, a booking text) on each booked transaction. Set `false`
            to drop it. The default matches the desktop's own review page, which
            starts with this on.

    TransactionCreate:
      type: object
      description: |
        A transaction to book. `type` decides which other fields apply; one that
        does not is rejected `not-applicable`.

        **Cash types** (`deposit`, `removal`, `interest`, `interest-charge`,
        `dividends`, `fees`, `fees-refund`, `taxes`, `tax-refund`) need
        `account`, and:

        - `security` is **required** for `dividends`, optional for `fees`,
          `fees-refund`, `taxes` and `tax-refund`, and rejected otherwise.
        - `shares` applies to `dividends` only.
        - `fees` applies to `dividends` only; `taxes` to `dividends` and
          `interest`. These are the dialogs' rules, not the model's — the model
          would accept a unit on anything.
        - `exDate` requires an instrument and must not be after `date`.

        **`buy` / `sell`** need `portfolio`, `account`, `security` and `shares`,
        and may carry `fees`, `taxes` and the optional
        `exchangeRate`/`forexGrossAmount` pair. **`delivery-inbound` /
        `delivery-outbound`** are the same without a cash leg: `portfolio`,
        `security`, `shares`, and a currency named by `amount`. An outbound
        delivery is the one type whose amount may be zero — it is what the
        application offers for a position written off rather than sold.

        **`transfer`** needs `fromAccount` and `toAccount`, plus `toAmount` when
        the two hold different currencies. **`security-transfer`** needs
        `fromPortfolio`, `toPortfolio`, `security` and `shares`, with `amount` in
        the instrument's own currency.
      additionalProperties: false
      required: [type, date, amount]
      properties:
        uuid:
          type: string
          format: uuid
          description: |
            Optional client-generated identity, making the call idempotent: a
            replay is answered `409 duplicate-uuid` instead of booking a second
            transaction. Checked against **both** legs of every cross entry, not
            only the ones the read endpoint reports.
        type:
          type: string
          enum:
            - deposit
            - removal
            - interest
            - interest-charge
            - dividends
            - fees
            - fees-refund
            - taxes
            - tax-refund
            - buy
            - sell
            - delivery-inbound
            - delivery-outbound
            - transfer
            - security-transfer
        account:
          type: string
          description: |
            UUID of the cash account. For a cash type it is where the
            transaction is booked; for a `buy` or `sell` it is the account
            paying or receiving, and the one whose currency the trade is
            denominated in.
        portfolio:
          type: string
          description: UUID of the investment account holding the position (`buy`, `sell`, deliveries).
        fromAccount:
          type: string
          description: UUID of the cash account money leaves (`transfer`).
        toAccount:
          type: string
          description: UUID of the cash account money arrives in (`transfer`).
        fromPortfolio:
          type: string
          description: UUID of the investment account the position leaves (`security-transfer`).
        toPortfolio:
          type: string
          description: UUID of the investment account the position arrives in (`security-transfer`).
        toAmount:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            What arrives in the target account of a cross-currency `transfer`, in
            that account's currency. Required exactly when the two accounts hold
            different currencies; the exchange rate recorded on the transfer is
            derived from the two amounts rather than asked for, since they
            already imply it.
        exchangeRate:
          type: number
          description: |
            The rate the broker actually used on a trade in a foreign-currency
            instrument, recorded so the trade reports as executed rather than at
            a rate looked up later. Sent together with `forexGrossAmount`, and
            rejected when the instrument is already in the account's currency.
        forexGrossAmount:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The gross value in the **instrument's** currency, checked against
            `exchangeRate` and the derived gross within the model's rounding
            tolerance.
        security:
          type: string
          description: UUID of the instrument the transaction relates to.
        date:
          type: string
          description: |
            An ISO date (`2026-07-20`) or date-time (`2026-07-20T14:30`). A
            plain date is taken as midnight, which is what the dialogs default
            to when the user does not set a time.
        exDate:
          type: string
          description: Ex-date, in the same two accepted forms as `date`.
        amount:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The net cash flow, unsigned and in the account's currency. The
            transaction type carries the direction.
        grossAmount:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Optional. Checked against the amount, fees and taxes and rejected
            `inconsistent-total` if it disagrees; it is never used in place of
            the derivation.
        fees:
          $ref: "#/components/schemas/MonetaryValue"
        taxes:
          $ref: "#/components/schemas/MonetaryValue"
        shares:
          type: number
          description: Number of shares, up to 8 decimal places.
        note:
          type: string

    Transaction:
      type: object
      description: One entry of the all-transactions list.
      required: [uuid, date, type, value, grossValue, fees, taxes, owner]
      properties:
        uuid:
          type: string
        date:
          type: string
          format: date-time
        type:
          type: string
          description: |
            A stable, machine-readable transaction type — not the (localized)
            label the desktop application shows.
          enum:
            - deposit
            - removal
            - interest
            - interest-charge
            - dividends
            - fees
            - fees-refund
            - taxes
            - tax-refund
            - buy
            - sell
            - transfer-in
            - transfer-out
            - delivery-inbound
            - delivery-outbound
        value:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The signed net cash flow: negative for a debit (a cash account's
            removal, fee, tax, transfer-out, …) or a liquidation (an investment
            account's sell, transfer-out, delivery-outbound); positive
            otherwise.
        grossValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The value before fees and taxes, as a plain (unsigned) magnitude.
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The fees charged, as a plain (unsigned) magnitude.
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The taxes charged, as a plain (unsigned) magnitude.
        shares:
          type: number
          description: The number of shares. Present only when `security` is present.
        security:
          type: object
          description: Omitted for a transaction without a security (e.g. a deposit).
          required: [uuid, name]
          properties:
            uuid:
              type: string
              description: Joins to `GET .../instruments/{uuid}` for master data.
            name:
              type: string
        owner:
          type: object
          description: The cash account or investment account the transaction belongs to.
          required: [uuid, name, type]
          properties:
            uuid:
              type: string
              description: |
                Joins to `GET .../cash-accounts/{uuid}` (type `cash-account`) or
                `GET .../investment-accounts/{uuid}` (type `investment-account`).
            name:
              type: string
            type:
              type: string
              enum: [cash-account, investment-account]
        counterOwner:
          type: object
          description: |
            The other side of a cross entry: the cash account a `buy`/`sell`
            settled against, or the receiving end of a `transfer-out` or a
            security transfer. The list de-duplicates a cross entry to one leg,
            reported under its own `owner` — this is what still names the
            account the money moved to or from. Omitted for a transaction that
            is not a cross entry.
          required: [uuid, name, type]
          properties:
            uuid:
              type: string
              description: |
                Joins to `GET .../cash-accounts/{uuid}` (type `cash-account`) or
                `GET .../investment-accounts/{uuid}` (type `investment-account`).
            name:
              type: string
            type:
              type: string
              enum: [cash-account, investment-account]
        note:
          type: string
          description: Omitted when not set.

    Holding:
      type: object
      description: |
        One line of the statement of assets — an instrument position or a cash
        account balance.
      required: [type, uuid, name, valuation, weight]
      properties:
        type:
          type: string
          description: |
            **Open set:** new kinds of holding may be added within v1. A holding
            of an unknown type still counts in `totalAssets` and `weight`; only
            the join to master data is unknown.
          x-extensible-enum: [instrument, cash-account]
        uuid:
          type: string
          description: |
            Joins to `GET .../instruments/{uuid}` (type `instrument`) or
            `GET .../cash-accounts/{uuid}` (type `cash-account`) for master data.
        name:
          type: string
        shares:
          type: number
          description: The number of shares held. Instruments only.
        price:
          allOf:
            - $ref: "#/components/schemas/Price"
          description: Instruments only.
        isin:
          type: string
          description: Instruments only. Omitted when not set.
        wkn:
          type: string
          description: Instruments only. Omitted when not set.
        tickerSymbol:
          type: string
          description: Instruments only. Omitted when not set.
        note:
          type: string
          description: Instruments only. Omitted when not set.
        attributes:
          type: object
          description: |
            Instruments only. The instrument's set custom attributes, keyed by
            attribute id, as in `GET .../instruments`. Omitted when none are set.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        purchasePrice:
          allOf:
            - $ref: "#/components/schemas/CostBasis"
          description: |
            Instruments only. The per-share cost basis at `costMethod`, over
            `(openingDate, date]`. Omitted when the security has no line item
            in the period (e.g. never held during it).
        purchaseValue:
          allOf:
            - $ref: "#/components/schemas/CostBasis"
          description: |
            Instruments only. The total cost basis of the shares held at
            `costMethod`, over `(openingDate, date]`. Omitted when the security
            has no line item in the period.
        profitLoss:
          type: object
          description: |
            Instruments only. The unrealized profit/loss against
            `purchaseValue.gross` at `costMethod`. Omitted when the security
            has no line item in the period.
          required: [value, percent]
          properties:
            value:
              $ref: "#/components/schemas/MonetaryValue"
            percent:
              type: [number, "null"]
              description: |
                A fraction (0.1 is 10%), not a percentage. `null` when the
                model cannot define it.
        delta:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. Market value plus sells and dividends over the
            period, minus purchase costs — a cost-method independent absolute
            performance figure. Omitted when the security has no line item in
            the period.
        deltaPercent:
          type: [number, "null"]
          description: |
            Instruments only. `delta` as a fraction (not a percentage) of
            capital committed. `null` when the model cannot define it. Omitted
            when `delta` is omitted.
        ttwror:
          type: [number, "null"]
          description: |
            Instruments only. The true time-weighted rate of return over the
            period, as a fraction. `null` when the model cannot define it.
            Omitted when the security has no line item in the period.
        ttwrorAnnualized:
          type: [number, "null"]
          description: |
            Instruments only. `ttwror` annualized. `null` when the model
            cannot define it. Omitted when the security has no line item in
            the period.
        irr:
          type: [number, "null"]
          description: |
            Instruments only. The internal (money-weighted) rate of return
            over the period, as a fraction. `null` when the model cannot
            define it. Omitted when the security has no line item in the
            period.
        dividends:
          type: object
          description: |
            Instruments only. Omitted when nothing applies: no dividend was
            received in the period and no dividend event is scheduled.
          properties:
            sum:
              allOf:
                - $ref: "#/components/schemas/MonetaryValue"
              description: |
                Dividends received over the period. Present only when the
                security has a line item in the period.
            totalRateOfReturn:
              type: number
              description: |
                `sum` as a fraction of the (gross) cost basis at `costMethod` -
                not a percentage. Present only when the security has a line
                item in the period.
            nextExDate:
              type: string
              format: date
              description: |
                The next upcoming ex-dividend date from the security's own
                dividend calendar, relative to today (regardless of `date`).
                Omitted when none is scheduled.
            nextPaymentDate:
              type: string
              format: date
              description: |
                The next upcoming dividend payment date, relative to today
                (regardless of `date`). Omitted when none is scheduled.
            nextPaymentAmount:
              allOf:
                - $ref: "#/components/schemas/MonetaryValue"
              description: |
                The amount of the next upcoming dividend payment. Omitted when
                `nextPaymentDate` is omitted.
        classifications:
          type: object
          description: |
            The holding's classification in every taxonomy the client defines,
            keyed by taxonomy id — an instrument or a cash account can each be
            classified (an asset-allocation taxonomy, for one, commonly
            classifies cash accounts too). Omitted when the client defines no
            taxonomies, or the holding is unclassified in all of them.
          additionalProperties:
            type: array
            description: |
              The holding's assignment(s) within one taxonomy - more than one
              when the holding is split across categories.
            items:
              type: object
              required: [path, weight]
              properties:
                path:
                  type: array
                  description: |
                    The classification's path from just below the taxonomy's
                    root to the leaf, as category names. The root itself is
                    never included - it names the taxonomy, not a category.
                  items:
                    type: string
                weight:
                  type: number
                  description: |
                    This assignment's fraction (0–1) of the holding - not a
                    percentage. 1 unless the holding is split across several
                    categories.
        valuation:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The holding's value in the reporting currency.
        weight:
          type: number
          description: The holding's fraction (0–1) of total assets — not a percentage.
        localValuation:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The holding's value in its own currency, before conversion into the
            reporting currency. Present only when the two currencies differ.
        exchangeRate:
          type: number
          description: |
            The exchange rate used to convert the holding's own currency into
            the reporting currency, on `date`. Applies to an instrument or a
            cash account alike. Omitted when the two currencies are the same
            or the holding has no currency at all.
        quoteReportingCurrency:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `price` converted into the reporting currency -
            distinct from `price`, which stays in the security's own currency.
            Omitted when the two currencies are the same (identical to
            `price`) or the security has no currency at all.
        purchasePriceLocal:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `purchasePrice.gross` at `costMethod`, in the
            security's own currency instead of the reporting currency (mirrors
            the desktop's "...BaseCurrency" columns). Omitted when the two
            currencies are the same, or the security has no line item in the
            period.
        purchaseValueLocal:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `purchaseValue.gross` at `costMethod`, in the
            security's own currency. Omitted when the two currencies are the
            same, or the security has no line item in the period.
        profitLossLocal:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `profitLoss.value` at `costMethod`, in the
            security's own currency. Omitted when the two currencies are the
            same, or the security has no line item in the period.
        distanceFromMovingAverage200:
          type: number
          description: |
            Instruments only. The latest price's relative distance from the
            200-day simple moving average ending on `date`, as a fraction, not
            a percentage. Omitted when there are fewer than 200 prices on or
            before `date`.
        distanceFromAllTimeHigh:
          type: number
          description: |
            Instruments only. The latest price's relative distance (always
            ≤ 0) from the highest price reached over `(openingDate, date]`, as
            a fraction, not a percentage. Omitted when the security has no
            price in the period.
        quoteRange:
          type: object
          description: |
            Instruments only. The lowest and highest price reached over
            `(openingDate, date]`. Omitted when the security has no price in
            the period.
          required: [low, lowDate, high, highDate]
          properties:
            low:
              $ref: "#/components/schemas/MonetaryValue"
            lowDate:
              type: string
              format: date
            high:
              $ref: "#/components/schemas/MonetaryValue"
            highDate:
              type: string
              format: date

    Performance:
      type: object
      description: |
        The return and value-change of the file between two valuation dates.
      required:
        - openingDate
        - closingDate
        - reportingCurrency
        - costMethod
        - ttwror
        - irr
        - breakdown
      properties:
        investmentAccount:
          type: object
          description: Present when the request was scoped with `investmentAccount`.
          required: [uuid, name, type]
          properties:
            uuid:
              type: string
            name:
              type: string
            type:
              type: string
              description: Always `investment-account`.
        openingDate:
          type: string
          format: date
          description: The opening valuation date.
        closingDate:
          type: string
          format: date
          description: The effective closing valuation date.
        reportingCurrency:
          type: string
          description: |
            The currency every amount in the breakdown is expressed in — the
            `reportingCurrency` query parameter, or the file's base currency.
            Not to be confused with a `MonetaryValue`'s `currency` (one amount)
            or an entity's `currencyCode` (its own declared currency).
        costMethod:
          type: string
          enum: [fifo, moving-average]
          description: |
            The cost basis method the realized/unrealized split was computed
            with — echoed because it moves the numbers, so a stored response
            stays interpretable.
        ttwror:
          type: [number, "null"]
          description: |
            The true time-weighted rate of return over the interval, as a
            fraction (0.0723 is 7.23 %) — not a percentage. `null` when the
            model cannot define it for the interval.
        irr:
          type: [number, "null"]
          description: |
            The internal (money-weighted) rate of return over the interval, as a
            fraction — not a percentage. `null` when the model cannot define it
            for the interval.
        breakdown:
          $ref: "#/components/schemas/PerformanceBreakdown"
        ratios:
          $ref: "#/components/schemas/PerformanceRatios"

    PerformanceRatios:
      type: object
      description: |
        Cost ratios for the period, as fractions — not percentages. Reported
        rather than left to the client to derive: the breakdown alone does not
        pin down the denominators these use.
      required: [taxRate, feeRate]
      properties:
        taxRate:
          type: [number, "null"]
          description: |
            `taxes / (unrealizedCapitalGains + realizedCapitalGains + income -
            fees)`, using unsigned magnitudes for taxes and fees. `null` when the
            denominator is zero, or when either side is negative — the ratio has
            no meaning for a loss-making period.
        feeRate:
          type: [number, "null"]
          description: |
            `fees / (unrealizedCapitalGains + realizedCapitalGains + income)`,
            using an unsigned magnitude for fees. `null` under the same
            conditions as `taxRate`.

    PerformanceCalendar:
      type: object
      required: [openingDate, closingDate, currency, months]
      properties:
        openingDate:
          type: string
          format: date
          description: |
            The opening valuation date this response covers, echoed from the
            request so a response always states its own period.
        closingDate:
          type: string
          format: date
          description: The closing valuation date this response covers.
        currency:
          type: string
          description: The reporting currency of every amount in `months`.
        months:
          type: array
          description: Ascending, one entry per calendar month, no gaps.
          items:
            $ref: "#/components/schemas/PerformanceMonth"

    PerformanceMonth:
      type: object
      required: [month, ttwror, earnings, fees, taxes, netTransfers, trades]
      properties:
        month:
          type: string
          description: The month, as `YYYY-MM`.
          pattern: "^[0-9]{4}-[0-9]{2}$"
        ttwror:
          type: [number, "null"]
          description: |
            The month's time-weighted return as a fraction — not a percentage.
            `null` when the performance index does not cover the month at all,
            which is different from a flat month (`0`).
        earnings:
          type: object
          required: [dividends, interest]
          properties:
            dividends:
              type: number
            interest:
              type: number
              description: Interest received less interest charged.
        fees:
          type: number
          description: A signed contribution, so never positive unless refunds exceeded fees.
        taxes:
          type: number
          description: A signed contribution, so never positive unless refunds exceeded taxes.
        netTransfers:
          type: number
          description: |
            External capital flow for the month: deposits less removals, plus
            inbound less outbound deliveries (a delivery moves assets without a
            cash leg, so it belongs here rather than with trades).
        trades:
          type: object
          required: [buys, sells, buyVolume, sellVolume]
          properties:
            buys:
              type: integer
            sells:
              type: integer
            buyVolume:
              type: number
            sellVolume:
              type: number

    SecurityPerformanceCollection:
      type: object
      required: [openingDate, closingDate, currency, items]
      properties:
        openingDate:
          type: string
          format: date
          description: |
            The opening valuation date this response covers, echoed from the
            request so a response always states its own period.
        closingDate:
          type: string
          format: date
          description: The closing valuation date this response covers.
        currency:
          type: string
          description: The reporting currency of every amount in `items`.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityPerformance"

    SecurityPerformance:
      type: object
      description: |
        One security's contribution over the period. Present whenever the
        security had any activity in the interval, whether or not it is still
        held at the end.
      required:
        - uuid
        - name
        - delta
        - deltaPercent
        - ttwror
        - irr
        - realizedGains
        - unrealizedGains
        - dividends
        - fees
        - taxes
        - heldAtClose
      properties:
        uuid:
          type: string
        name:
          type: string
        delta:
          $ref: "#/components/schemas/MonetaryValue"
        deltaPercent:
          type: [number, "null"]
          description: |
            `delta` relative to the capital it was earned on, as a fraction — not
            a percentage.
        ttwror:
          type: [number, "null"]
          description: |
            The security's time-weighted return over the period, as a fraction.
            `null` when the model cannot define it (see the holdings endpoint's
            note on securities acquired only through an inbound delivery).
        irr:
          type: [number, "null"]
          description: The security's money-weighted return, as a fraction.
        realizedGains:
          $ref: "#/components/schemas/MonetaryValue"
        unrealizedGains:
          $ref: "#/components/schemas/MonetaryValue"
        dividends:
          $ref: "#/components/schemas/MonetaryValue"
        fees:
          $ref: "#/components/schemas/MonetaryValue"
        taxes:
          $ref: "#/components/schemas/MonetaryValue"
        heldAtClose:
          type: boolean
          description: |
            Whether any shares were still held at the end of the period. `false`
            marks a position that was closed inside the period — a case a
            holdings snapshot at `closingDate` cannot report at all.

    PerformanceSeries:
      type: object
      description: |
        The daily performance index for a period, plus the risk metrics derived
        from it.
      required: [openingDate, closingDate, currency, risk, days]
      properties:
        investmentAccount:
          type: object
          description: Present when the request was scoped with `investmentAccount`.
          required: [uuid, name, type]
          properties:
            uuid:
              type: string
            name:
              type: string
            type:
              type: string
              description: Always `investment-account`.
        openingDate:
          type: string
          format: date
          description: The opening valuation date, and the index's rebase point.
        closingDate:
          type: string
          format: date
          description: |
            The requested closing valuation date. The `days` entries can stop
            earlier, since the series is clamped to today.
        currency:
          type: string
          description: The reporting currency of every amount in `days`.
        risk:
          $ref: "#/components/schemas/RiskMetrics"
        days:
          type: array
          description: |
            One entry per calendar day, ascending, starting at `openingDate`.
          items:
            $ref: "#/components/schemas/PerformanceSeriesDay"

    PerformanceSeriesDay:
      type: object
      required: [date, ttwror, totalAssets, investedCapital, netDeposits, drawdown]
      properties:
        date:
          type: string
          format: date
        ttwror:
          type: [number, "null"]
          description: |
            The accumulated time-weighted return from `openingDate` to this day,
            as a fraction — not a percentage. 0 on the first day by construction.
        totalAssets:
          type: number
          description: Total assets on this day, in the response's `currency`.
        investedCapital:
          type: number
          description: |
            The invested-capital series in the response's `currency`: what has
            been put into the portfolio, seeded with the opening total assets.
            The gap to `totalAssets` is the absolute gain.
        netDeposits:
          type: number
          description: |
            **This day's** external flow (deposits less removals) in the
            response's `currency` — a per-day amount, not a running total.
        drawdown:
          type: [number, "null"]
          description: |
            The decline from the index's running high water mark on this day, as
            a fraction. Zero at a new peak, negative otherwise.

    RiskMetrics:
      type: object
      description: |
        Risk measures for the period, computed from the daily index by the same
        code the desktop application's risk widgets use.
      required:
        - maxDrawdown
        - maxDrawdownPeak
        - maxDrawdownTrough
        - maxDrawdownDurationDays
        - maxDrawdownDurationStart
        - maxDrawdownDurationEnd
        - volatility
        - semiDeviation
        - riskFreeRate
        - sharpeRatio
        - allTimeHigh
      properties:
        maxDrawdown:
          type: [number, "null"]
          description: |
            The deepest peak-to-trough decline over the period, as a **negative**
            fraction, matching the sign of `days[].drawdown`.
        maxDrawdownPeak:
          type: string
          format: date
          description: The peak the deepest drawdown fell from.
        maxDrawdownTrough:
          type: string
          format: date
          description: The trough of the deepest drawdown.
        maxDrawdownDurationDays:
          type: integer
          description: |
            The longest stretch, in days, spent below a previous peak. This is a
            different interval from `maxDrawdownPeak`/`maxDrawdownTrough`: the
            deepest drawdown and the longest one need not be the same episode.
        maxDrawdownDurationStart:
          type: string
          format: date
        maxDrawdownDurationEnd:
          type: string
          format: date
        volatility:
          type: [number, "null"]
          description: |
            The standard deviation of the daily returns, as a fraction. Weekends,
            public holidays and days with no holdings are excluded. Not
            annualized.
        semiDeviation:
          type: [number, "null"]
          description: |
            The standard deviation of the negative daily returns only (downside
            volatility), on the same basis as `volatility`.
        riskFreeRate:
          type: [number, "null"]
          description: |
            The risk-free rate of return configured for this file, as a fraction
            (0 unless set). It is a property of the file, not a request
            parameter: the desktop application stores it per client and uses it
            for the same Sharpe ratio reported here.
        sharpeRatio:
          type: [number, "null"]
          description: |
            `(irr - riskFreeRate) / volatility`: the excess money-weighted
            return per unit of risk, a plain number rather than a fraction of
            anything. Computed exactly as the desktop application's Sharpe ratio
            widget computes it, from the same inputs. Null when the volatility is
            zero (a single valuation day, or no holdings at all), since the ratio
            is then undefined.
        allTimeHigh:
          $ref: "#/components/schemas/IndexHighWaterMark"

    IndexHighWaterMark:
      type: object
      description: |
        The highest point the accumulated index reached within the period. This
        is the index's own high water mark, not a security's all-time high: the
        value is an accumulated return, not a price.
      required: [value, distance]
      properties:
        value:
          type: [number, "null"]
          description: |
            The accumulated return at the peak, as a fraction — not a percentage.
        date:
          type: string
          format: date
          description: The day the peak was reached. Omitted when the series is empty.
        distance:
          type: [number, "null"]
          description: |
            How far the final day sits below that peak, as a negative fraction
            (0 when the period ends at its high).

    PerformanceBreakdown:
      type: object
      description: |
        A signed decomposition of the value change: the fields add up to the
        closing value —
        `openingValue + unrealizedCapitalGains + realizedCapitalGains + income +
        fees + taxes + currencyGains + netDeposits = closingValue`.
      required:
        - openingValue
        - unrealizedCapitalGains
        - realizedCapitalGains
        - income
        - fees
        - taxes
        - currencyGains
        - netDeposits
        - closingValue
      properties:
        openingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The portfolio's value at `openingDate`.
        unrealizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The change in value of positions still held; negative for a loss.
        realizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains locked in by sales during the interval; negative for a loss.
        income:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Dividends and interest received, net of interest charged.
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Fees paid, as a negative contribution (positive only for a net refund).
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Taxes paid, as a negative contribution (positive only for a net refund).
        currencyGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gain or loss attributable to exchange rate movements.
        netDeposits:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            External capital flow over the interval: deposits and inbound
            deliveries less removals and outbound deliveries. Not part of the
            performance-driven change, but required for the value reconciliation.
        closingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The portfolio's value at `closingDate`.

    InstrumentPerformanceContext:
      type: object
      description: |
        The interval and the parameters a per-instrument report was computed
        with. All six are echoed, so that a stored or forwarded response stays
        interpretable — three of them move the numbers.
      required:
        - openingDate
        - closingDate
        - reportingCurrency
        - costMethod
        - taxesAndFees
        - metrics
      properties:
        openingDate:
          type: string
          format: date
          description: The opening valuation date.
        closingDate:
          type: string
          format: date
          description: The effective closing valuation date.
        reportingCurrency:
          type: string
          description: |
            The currency every amount in this report has been converted into.
            Not to be confused with a `MonetaryValue`'s `currency` (one amount)
            or an instrument's `currencyCode` (its own declared currency) — on
            the item route the last two sit right next to this one.
        costMethod:
          type: string
          enum: [fifo, moving-average]
          description: The cost basis method that was applied.
        taxesAndFees:
          type: string
          enum: [included, excluded]
          description: |
            Whether the cost basis includes the taxes and fees embedded in a
            trade.
        metrics:
          type: array
          description: The metric groups present in each item, in schema order.
          items:
            type: string
            enum:
              [valuation, gains, income, expenses, moneyWeighted, timeWeighted, risk]

    InstrumentPerformance:
      type: object
      description: |
        One instrument's performance over the interval. Only the identity fields
        are always present; each metric group appears exactly if it was
        selected.
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
          description: |
            Joins to `GET .../instruments/{uuid}` for the master data. The ISIN,
            WKN and ticker are deliberately not repeated here.
        name:
          type: string
        currencyCode:
          type: string
          description: |
            The instrument's *own* declared currency — what explains a non-zero
            currency component below. Always set: only instruments with
            transactions appear here, and the application refuses transactions
            on an instrument without a currency. Distinct from
            `reportingCurrency`, which every amount in this report is expressed
            in.
        valuation:
          $ref: "#/components/schemas/InstrumentValuation"
        gains:
          $ref: "#/components/schemas/InstrumentGains"
        income:
          $ref: "#/components/schemas/InstrumentIncome"
        expenses:
          $ref: "#/components/schemas/InstrumentExpenses"
        moneyWeighted:
          type: object
          required: [irr]
          properties:
            irr:
              type: [number, "null"]
              description: |
                The internal (money-weighted) rate of return on this instrument
                over the interval, as a fraction — not a percentage. `null` when
                the model cannot define it.
        timeWeighted:
          type: object
          required: [ttwror, ttwrorAnnualized]
          properties:
            ttwror:
              type: [number, "null"]
              description: |
                The true time-weighted rate of return over the interval, as a
                fraction (0.0812 is 8.12 %). `null` when the model cannot define
                it.
            ttwrorAnnualized:
              type: [number, "null"]
              description: |
                The same return expressed as an annual rate. `null` when the
                model cannot define it.
        risk:
          $ref: "#/components/schemas/InstrumentRisk"

    InstrumentValuation:
      type: object
      description: |
        What the position was worth at each end of the interval, and what it
        stands in the books at.
      required: [shares, openingValue, closingValue, periodCostBasis]
      properties:
        shares:
          type: number
          description: The number of shares held at `closingDate`; 0 for a position sold during the period.
        openingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The position's value at `openingDate`; zero for an instrument first
            acquired during the period.
        closingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The position's value at `closingDate`. Equals this instrument's
            `valuation` in `GET .../holdings?date={closingDate}`.
        periodCostBasis:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The cost basis of the shares still held, **relative to this
            period**: a lot carried in from before `openingDate` enters at its
            valuation on that date, not at what was once paid for it. A position
            bought years ago therefore shows this period's opening value here,
            and its lifetime gain is not derivable from this resource. (The
            unqualified acquisition cost is a separate, period-independent
            figure this API does not yet publish.)

            Whether the taxes and fees embedded in a purchase are part of it is
            decided by `taxesAndFees`, which governs the capital gains figures
            in the same breath — so that
            `closingValue - periodCostBasis = gains.unrealizedCapitalGains`
            holds under either setting.

    InstrumentGains:
      type: object
      description: |
        Capital gains, split into the part locked in by sales and the part still
        on the books. Both are measured against `periodCostBasis`, hence
        `closingValue - periodCostBasis = unrealizedCapitalGains`.
      required:
        - realizedCapitalGains
        - realizedCurrencyComponent
        - unrealizedCapitalGains
        - unrealizedCurrencyComponent
      properties:
        realizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains locked in by sales during the interval; negative for a loss.
        realizedCurrencyComponent:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The part of `realizedCapitalGains` attributable to exchange rate
            movements. It is **contained in** that figure, not additional to it
            — do not add the two. Zero unless the instrument's `currencyCode`
            differs from `reportingCurrency`.
        unrealizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains on the shares still held; negative for a loss.
        unrealizedCurrencyComponent:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The part of `unrealizedCapitalGains` attributable to exchange rate
            movements, contained in it exactly as its realized counterpart is.

    InstrumentIncome:
      type: object
      description: What the instrument paid out during the interval.
      required: [dividends, dividendCount]
      properties:
        dividends:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gross dividends received during the interval.
        dividendCount:
          type: integer
          description: The number of dividend payments during the interval.
        lastDividend:
          type: string
          format: date
          description: |
            The date of the most recent payment. Omitted when there was none —
            never a placeholder date.

    InstrumentExpenses:
      type: object
      description: |
        What the instrument cost during the interval: the charges embedded in
        its trades and dividends, plus the standalone fee and tax bookings
        attributed to it, net of refunds.
      required: [fees, taxes]
      properties:
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The fees charged, as a positive magnitude — unlike the aggregate
            endpoint's `breakdown.fees`, which is negated so that its
            decomposition adds up.
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The taxes charged, as a positive magnitude.

    InstrumentRisk:
      type: object
      description: |
        Risk measures derived from the instrument's daily valuation series over
        the interval. All are fractions, never percentages.
      required: [volatility, semiVolatility, maxDrawdown, longestDrawdownDays]
      properties:
        volatility:
          type: [number, "null"]
          description: The standard deviation of the return series.
        semiVolatility:
          type: [number, "null"]
          description: The standard deviation of the negative returns only.
        maxDrawdown:
          type: [number, "null"]
          description: |
            The deepest peak-to-trough decline, as a **positive** fraction
            (0.231 is a 23.1 % drawdown), matching the application's own sign
            convention rather than the negative one charts often use.
        longestDrawdownDays:
          type: integer
          description: |
            The length in days of the longest stretch without a new high: from
            a peak to the next strictly higher value, or to the end of the
            period if the peak was never regained. Because it is measured
            between data points, it is never shorter than the sampling interval
            — a period with no drawdown at all still reports 1. This is **not**
            the duration of the deepest drawdown, which is a different and
            shorter interval — hence the name.

    FieldError:
      type: object
      description: One field-level violation within a `Problem`.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The offending field (or the resource facet that blocks the operation).
        code:
          type: string
          description: |
            A stable, machine-readable reason.

            **Open set:** new codes may be added within v1. Treat an unknown
            code as a rejection of `field` for the reason given in `message`.
          x-extensible-enum:
            - required
            - invalid-type
            - invalid-value
            - invalid-range
            - too-long
            - duplicate
            - unknown-field
            - unknown-parameter
            - duplicate-parameter
            - unknown-reference
            - conflicting-value
            - unknown-currency
            - currency-mismatch
            - not-applicable
            - inconsistent-total
            - locked-by-transactions
            - exchange-rate-requires-currency
            - referenced
            - unknown-attribute
            - attribute-not-applicable
            - unsupported-attribute-type
        message:
          type: string
          description: Human-readable explanation of this one violation.

    Problem:
      type: object
      description: |
        An error, following RFC 9457 (`application/problem+json`). `title` is
        invariant for a given `type`; anything specific to the one occurrence is in
        `detail`. Validation and conflict problems additionally carry `errors`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI identifying the problem kind. The distinct values are enumerated
            below; note especially that a **404 never distinguishes** an unknown
            file from a file that exists but is not enabled, that
            `no-activity-in-period` is the one 404 that says the addressed entity
            *does* exist, and that the four
            **409** kinds each call for a different response:
            `file-not-open` (a human must open the file), `ambiguous-alias` (retry
            with the `id`), `delete-blocked` (give up — the instrument is
            referenced), `duplicate-uuid` (stop — the transaction is already
            booked, which is exactly what a client-supplied uuid is for).
            `method-not-allowed` (405) is returned for any method a path does not
            list; v1 has no create endpoints.

            **Open set:** new problem types may be added within v1. Treat an
            unknown `type` by its HTTP `status`.
          x-extensible-enum:
            - https://portfolio-performance.info/rest/problems/invalid-request
            - https://portfolio-performance.info/rest/problems/unauthorized
            - https://portfolio-performance.info/rest/problems/forbidden-host
            - https://portfolio-performance.info/rest/problems/browser-origin-forbidden
            - https://portfolio-performance.info/rest/problems/not-found
            - https://portfolio-performance.info/rest/problems/no-activity-in-period
            - https://portfolio-performance.info/rest/problems/method-not-allowed
            - https://portfolio-performance.info/rest/problems/request-too-large
            - https://portfolio-performance.info/rest/problems/file-not-open
            - https://portfolio-performance.info/rest/problems/ambiguous-alias
            - https://portfolio-performance.info/rest/problems/delete-blocked
            - https://portfolio-performance.info/rest/problems/duplicate-uuid
            - https://portfolio-performance.info/rest/problems/validation
            - https://portfolio-performance.info/rest/problems/user-interaction
            - https://portfolio-performance.info/rest/problems/pairing-pending
            - https://portfolio-performance.info/rest/problems/pairing-cooldown
            - https://portfolio-performance.info/rest/problems/internal-error
        title:
          type: string
          description: Short, human-readable summary of the problem kind.
        status:
          type: integer
          description: The HTTP status code, repeated for convenience.
        detail:
          type: string
          description: |
            Human-readable explanation specific to this occurrence. Present only
            when there is something occurrence-specific to say.
        errors:
          type: array
          description: |
            Present on validation (`422`), some conflict (`409`), and invalid
            query parameter (`400`) problems: all field-level violations,
            reported at once.
          items:
            $ref: "#/components/schemas/FieldError"
        pairingEndpoint:
          type: string
          description: |
            RFC 9457 extension member, present on `401 unauthorized`: the path
            where a client requests access interactively (`/v1/auth/requests`).

  responses:
    BadRequest:
      description: |
        The request body is not a JSON object, or a query parameter is unknown to
        this operation or invalid (`invalid-request`). Either way the offending
        names are itemized in `errors`, one entry each.

        **Every operation can answer this**, including those that take no body and
        list no parameters: an operation that lists none accepts none, and rejects
        anything sent.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotModified:
      description: |
        Your `If-None-Match` still matches, so the representation you hold is
        current. No body, by RFC 9110 — reuse what you cached.
      headers:
        ETag:
          description: The validator that matched, repeated for convenience.
          schema:
            type: string

    Unauthorized:
      description: |
        Missing or invalid bearer token (`unauthorized`). The problem body
        carries a `pairingEndpoint` extension member naming the path where a
        client can request access interactively.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: https://portfolio-performance.info/rest/problems/unauthorized
                title: Missing or invalid bearer token
                status: 401
                pairingEndpoint: /v1/auth/requests

    Forbidden:
      description: |
        The request was not addressed as loopback (`forbidden-host`) or it carried
        an `Origin` header (`browser-origin-forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: |
        Unknown file, **file not enabled**, or unknown entity (`not-found`). A file
        that is not enabled is deliberately indistinguishable from one that does not
        exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: |
        The addressed file or entity cannot serve the request in its current state:
        `file-not-open` (enabled but not open — a human must open it),
        `ambiguous-alias` (the alias matches several records — use the `id`),
        `delete-blocked` (on delete: the instrument is referenced by transactions or
        plans), or `duplicate-uuid` (on create: a transaction with the supplied uuid
        already exists, so the request was a replay and must not be retried).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    ValidationFailed:
      description: |
        One or more fields were rejected (`validation`). See `errors` for every
        violation; nothing is applied unless everything validates.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknownCurrency:
              value:
                type: https://portfolio-performance.info/rest/problems/validation
                title: Validation failed
                status: 422
                errors:
                  - field: currencyCode
                    code: unknown-currency
                    message: XYZ is not a known currency

    TooManyPairingRequests:
      description: |
        Another pairing request is awaiting the user's decision
        (`pairing-pending`), or a previous request was declined and a cool-down
        is active (`pairing-cooldown`). Respect `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Locked:
      description: |
        A modal dialog is open or the user is editing a table cell, so the write was
        refused rather than clobbered (`user-interaction`). **Normal and
        temporary** — respect `Retry-After` and try again.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    InternalError:
      description: An unexpected error (`internal-error`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
