openapi: 3.1.0

info:
  title: Portfolio Performance REST API
  version: 1.0.0
  license:
    name: Eclipse Public License 1.0
    identifier: EPL-1.0
  description: |
    A **local** HTTP/JSON API into the running Portfolio Performance desktop
    application, so that scripts and AI agents can read and edit the data of
    open portfolio files.

    ## How to reach it

    - Base URL `http://127.0.0.1:{port}` (default port **5712**), **loopback only**.
    - The server binds `127.0.0.1` and is **off by default**; the user enables it
      in Preferences → MCP Server & REST API.
    - Every request needs a **bearer token** — except the pairing endpoints below,
      whose purpose is to obtain one. See the `bearerAuth` scheme.
    - The server serves this document at `GET /v1/openapi.yaml`, unauthenticated,
      so the contract of the running server is discoverable at runtime.

    ## The MCP endpoint

    The same server also answers `POST /mcp`, a Model Context Protocol endpoint
    over Streamable HTTP that offers sixteen of the operations below as named
    tools, for chat clients that cannot run a script. Same switch, same port,
    same bearer tokens — point a client at `http://127.0.0.1:{port}/mcp` and give
    it an `Authorization: Bearer …` header.

    It sits deliberately **outside `/v1`**, because MCP negotiates its own version
    in its `initialize` handshake, and it is therefore **not** covered by the
    promise below. It is described by `mcp-tools.json` in the same bundle as this
    document rather than here: one JSON-RPC endpoint is not sixteen REST
    operations, and pretending otherwise would make this document claim a
    contract it does not define. Nothing about it changes anything for a client
    of this document.

    ## Compatibility — what `/v1` promises

    **Everything under `/v1` is additive.** Within it, no field, endpoint,
    parameter or value ever changes meaning, changes type or disappears; the only
    changes are new ones. A change that would break a client is not made here —
    it means **`/v2` at a new path**, served alongside, so nothing you already
    call stops working.

    `info.version` is the counter *within* that promise: it rises as endpoints and
    fields are added, and never goes major inside `/v1`. Read it cheaply from
    `GET /v1/version` rather than parsing this document.

    So a client built against an older `1.x` keeps working against a newer server —
    it simply cannot see what it does not know about. A client built against a
    *newer* `1.x` than the server it meets will find some endpoints absent (`404`)
    and should say which, rather than failing wholesale.

    For that to hold, a client owes two things in return:

    - **Ignore properties you do not know.** New fields appear in responses
      without notice.
    - **Accept values you do not know in an open set.** A response field marked
      `x-extensible-enum` lists the values known today, and new ones may be
      added within v1 — new problem types, error codes, attribute types, kinds
      of holding. Each such field says what an unknown value means; handle it
      that way instead of failing. A field typed with a plain `enum` is closed:
      its values are fixed for v1.

    Two things this deliberately does **not** promise: the order of items in a
    collection where none is documented, and the exact prose of a `title` or
    `message` field. Match on `type` and `code`, never on prose.

    ## How to get a token (interactive pairing)

    Each client holds its own token. To obtain one:

    1. `POST /v1/auth/requests` with your program's name. The user is asked to
       approve or decline the request inside Portfolio Performance — tell them
       to look at the application.
    2. Poll `GET /v1/auth/requests/{id}` every 1–2 seconds. While the answer is
       `pending`, keep polling; the request expires after 2 minutes.
    3. On `approved`, the response carries the token — **exactly once**. Store it;
       it cannot be retrieved again. The user chooses whether the grant is
       permanent or expires when the application quits.

    Every `401` response carries the pairing endpoint in its `pairingEndpoint`
    field, so this flow is discoverable at runtime. Users can also mint a token
    manually (Preferences → MCP Server & REST API → "Add client") for headless setups, and can
    revoke any client there at any time.

    ## Constraints that are not expressible in this document

    These are enforced by the server but cannot be described as schema or security,
    so they are stated here. Each violation is reported as a distinct problem type
    (see the `Problem` schema):

    - **Loopback Host only.** The API must be addressed as `127.0.0.1`, `[::1]` or
      `localhost`. A request whose `Host` header names any other authority is
      rejected `403 forbidden-host`. This defeats DNS rebinding — a web page cannot
      point its own domain at 127.0.0.1 and reach the API.
    - **No browser origin.** Any request that carries an `Origin` header is rejected
      `403 browser-origin-forbidden`. A web page therefore cannot reach this API.
    - **Bounded request body.** A body larger than 1 MiB is rejected
      `413 request-too-large` without being read to the end. Every legitimate
      request is far smaller; the limit exists because bodies are buffered whole.
      The two operations whose body **is an uploaded file** — `createImport` and
      `previewCsvColumns` — accept up to **16 MiB** instead: that reasoning is
      about JSON documents a client composes, and a year of bank statements is
      legitimately larger. The limit is enforced the same way, by reading one
      byte past it rather than by trusting `Content-Length`.
    - **Per-file access.** Only files the user has individually enabled are visible.
      A file that exists but is not enabled answers exactly like one that does not
      exist (`404 not-found`) — the token must not let a client enumerate files the
      user did not share.

    ## Rates and ratios

    A rate — `ttwror`, `irr`, `volatility`, `maxDrawdown`, a trade's `return` — is
    a **fraction**, so `0.0723` is 7.23 %, and it is served rounded to **8 decimal
    places**. The raw computation carries no more meaning than that: IRR is found
    by an iteration that stops once successive estimates differ by less than
    1e-5, and TTWROR chains period returns whose rounding accumulates. Eight
    decimals keep three orders of magnitude more precision than the best-resolved
    rate actually has, and collapse the residue of an iteration that halted near
    zero, which would otherwise be served as a return like
    `-0.000000000002438937940496544`.

    A rate the model cannot define for the interval is `null`, never `0` — handle
    it rather than assuming a number. A **weight** is not a rate and is not
    rounded: a dust holding is a legitimately tiny fraction of a portfolio, where
    a rate that small is only ever noise.

    ## Methods

    A path serves only the methods listed for it in this document; the only
    `POST` endpoint is the pairing request — v1 has **no create endpoints for
    portfolio data**. Calling any method that a path does not list returns
    `405 method-not-allowed`.

    ## Query parameters

    An operation accepts only the query parameters listed for it here, and an
    operation that lists none accepts none. Anything else is rejected
    `400 invalid-request`, with one `errors` entry per offending name
    (`code: unknown-parameter`) that names the parameters the endpoint does
    accept — send two typos and you learn about both in one round trip.

    This is deliberate rather than lenient: an ignored parameter would be
    answered with a complete, confident-looking report computed from defaults.
    `GET .../holdings?currency=USD` — a plausible misremembering of
    `reportingCurrency` — would return the base-currency statement of assets,
    and only a client that compared the echoed `reportingCurrency` against what
    it sent would notice. Failing the request is the only answer that cannot be
    mistaken for the requested one.

    **Names are case-sensitive**, exactly as spelled here: `reportingcurrency`
    is rejected, not treated as `reportingCurrency`. Accepting a case variant
    would mean guessing, and the response says so, naming the parameter meant.
    ## Caching: change counter and ETags

    Every file carries a **change counter** (`changeId` on `GET /v1/files`) that
    grows with every change to its model — whether the change came through this
    API or from the user editing in the desktop application. Only equality is
    meaningful, and it starts over when the application restarts, so never persist
    it: compare it with the one you saw a moment ago, nothing more.

    Every **file-scoped read** answers with a strong `ETag` and honors
    `If-None-Match`. The validator is derived from the file's change counter, the
    current date and the request itself, so it is known *before* the response is
    computed: a `304` skips the snapshot or the performance index entirely, not
    just the transfer. That is why sending back the tag you hold is worth doing
    even on a loopback connection where bandwidth is free.

    The current date is part of the validator because a response that defaults to
    "today" is a different response tomorrow; a tag therefore expires on its own at
    midnight, without the server tracking anything.

    **Each name at most once.** A repeated name is rejected `400
    invalid-request` (`code: duplicate-parameter`) rather than reduced to one
    of its values — `?metrics=risk&metrics=gains` would otherwise be answered
    as if only `gains` had been asked for. A list parameter takes one
    comma-separated value: `?metrics=risk,gains`.
    A calculation endpoint samples the change counter before and after computing
    and redoes the work if the user edited the file in between, so a response
    never reports a state that half of it contradicts. If the model keeps moving,
    the last result is served anyway but **without an `ETag`** — it may straddle
    an edit, and nothing that may be wrong should become cacheable. Treat a
    file-scoped read that carries no `ETag` as "do not store this".

    ## Writes are not saved

    A write (`PATCH`, `DELETE`) mutates the **in-memory** file and marks it dirty,
    exactly as if the user had edited it in the UI. The change is visible
    immediately, but **there is no save endpoint** — only the user saves the file
    (or discards the change by closing without saving).

    While the user has a modal dialog open or is editing a table cell, writes are
    rejected with `423 user-interaction` rather than silently clobbered. This is
    **normal and temporary**: respect the `Retry-After` header and try again. Reads
    are unaffected.

servers:
  - url: http://127.0.0.1:{port}
    description: Loopback interface of the running application
    variables:
      port:
        default: "5712"
        description: The port configured in Preferences → MCP Server & REST API

security:
  - bearerAuth: []

tags:
  - name: Discovery
    description: Learn the contract before you hold a token
  - name: Pairing
    description: Obtain a bearer token interactively, approved by the user
  - name: Files
    description: The open portfolio files you are allowed to address
  - name: Instruments
    description: Securities held in a file (stocks, funds, crypto, …)
  - name: Cash accounts
    description: Accounts holding cash in a single currency
  - name: Investment accounts
    description: Accounts holding instrument positions
  - name: Holdings
    description: The statement of assets — every holding valued at a date
  - name: Taxonomies
    description: The category schemes a file classifies its holdings by.
  - name: Performance
    description: Return and value-change of the file over an interval
  - name: Trades
    description: Matched buy/sell pairs, computed from the transactions

paths:
  /v1/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      tags: [Discovery]
      summary: This API's own OpenAPI description
      description: |
        Serves this very document, so a client can discover the full contract at
        runtime. No bearer token required — the document carries no user data and
        describes the pairing flow itself, so it is reachable before you hold a
        token. The `Host` (loopback) and `Origin` (no-browser) checks still apply.

        What you get back is the description of the **running** server, so it can
        never drift from the endpoints actually served.
      security: []
      responses:
        "200":
          description: The OpenAPI document, as YAML.
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/version:
    get:
      operationId: getApiVersion
      tags: [Discovery]
      summary: The version of the API contract
      description: |
        The `/v1` contract version, and the release of the application serving
        it. No bearer token required, for the same reason the OpenAPI document
        needs none: it carries no user data, and a client needs it *before* it
        can judge whether talking to this server is worth attempting.

        Exists so that a client does not have to fetch and parse this whole
        document to read one line of it. See **Compatibility** above for what a
        version means.
      security: []
      responses:
        "200":
          description: The contract version.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion]
                properties:
                  apiVersion:
                    type: string
                    description: |
                      The version of the `/v1` contract, e.g. `1.3.0`. Rises as
                      endpoints and fields are added; never goes major within
                      `/v1`.
                  applicationVersion:
                    type: string
                    description: |
                      The running application's release, e.g. `0.87.1` — what to
                      tell a *human* to update, since nobody thinks in API
                      versions. Absent when the server runs outside the packaged
                      application, so treat it as optional.
              examples:
                default:
                  value:
                    apiVersion: "1.0.0"
                    applicationVersion: "0.87.1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/requests:
    post:
      operationId: createPairingRequest
      tags: [Pairing]
      summary: Ask the user for API access
      description: |
        Files an access request that the user answers inside Portfolio
        Performance. No bearer token required. At most one request may be
        pending at a time, and after a decline new requests are rejected for a
        cool-down period — both are reported `429` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientName]
              additionalProperties: false
              description: |
                Any other member is rejected with `422` and code `unknown-field`.
              properties:
                clientName:
                  type: string
                  maxLength: 64
                  description: |
                    The name of your program, shown to the user in the approval
                    prompt. Control characters are stripped.
            examples:
              default:
                value:
                  clientName: Claude Code
      responses:
        "201":
          description: The request is filed and awaiting the user's decision.
          headers:
            Location:
              description: The status resource to poll.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyPairingRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/requests/{id}:
    get:
      operationId: pollPairingRequest
      tags: [Pairing]
      summary: Poll the state of an access request
      description: |
        Returns the request's state. `pending` can be read any number of times;
        a terminal state (`approved` with the token, `denied`, `expired`) is
        delivered **exactly once** — afterwards, and for ids never issued, the
        answer is `404`. Poll every 1–2 seconds.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The request id from `POST /v1/auth/requests`
          schema:
            type: string
      responses:
        "200":
          description: The state of the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestStatus"
              examples:
                pending:
                  value:
                    status: pending
                approved:
                  value:
                    status: approved
                    token: wZ4mJc9Y3K…
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: List the files you may address
      description: |
        Lists only files that are **open and enabled**. Address a file in the
        `{file}` path segment below by either its `id` or its `alias`.

        Each item carries the file's `changeId` and `dirty` flag, so this one cheap
        call tells a client whether anything in a file moved since it last looked —
        including edits the user made in the desktop application.
      responses:
        "200":
          description: The addressable files
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
              examples:
                default:
                  value:
                    items:
                      - id: 5f3c1e2a-0b7d-4a1e-9c2f-8d6b3a1e0f42
                        alias: main
                        label: portfolio.xml
                        path: /Users/me/portfolio.xml
                        changeId: 42
                        dirty: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: listInstruments
      tags: [Instruments]
      summary: List the instruments in a file
      responses:
        "200":
          description: The instruments in the file
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getInstrument
      tags: [Instruments]
      summary: Read a single instrument
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The instrument
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
              examples:
                default:
                  value:
                    uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                    name: Apple Inc.
                    currencyCode: USD
                    isin: US0378331005
                    wkn: "865985"
                    tickerSymbol: AAPL
                    note: Core holding
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchInstrument
      tags: [Instruments]
      summary: Update an instrument (JSON Merge Patch)
      description: |
        A **JSON Merge Patch** (RFC 7386), *not* the full target state: fields you
        omit stay untouched, and an explicit `null` clears an optional field.
        Returns the updated instrument.

        Any field that is unknown or not writable is rejected `422`, never a silent
        no-op — a typo must not look like success. All violations are reported at
        once so they can be fixed in one round-trip.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/InstrumentPatch"
            examples:
              renameAndClearNote:
                summary: Rename and clear the note
                value:
                  name: Apple
                  note: null
      responses:
        "200":
          description: The updated instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteInstrument
      tags: [Instruments]
      summary: Delete an instrument
      description: |
        Deletes the instrument. **Rejected `409 delete-blocked`** if transactions
        or investment plans reference it — deleting it in the application would
        cascade into transaction history, which the API refuses to do on a client's
        behalf. Watchlist and taxonomy membership do not block the delete.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/{uuid}/prices:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: listInstrumentPrices
      tags: [Instruments]
      summary: Read the historical quotes of an instrument
      description: |
        The price series stored in the file, oldest first, in the instrument's own
        currency — the quotes as recorded, not converted and not recomputed, so a
        chart drawn from them matches the application's own price chart.

        The latest intraday quote is merged in when the history holds no entry for
        its date, which keeps the last point current between quote updates.

        `from` and `to` are inclusive, and both are optional: an absent bound means
        the start (or end) of the recorded history. The response echoes the range it
        actually covers, so an empty tail of the requested range is distinguishable
        from a history that simply stops earlier.
      parameters:
        - name: from
          in: query
          description: Earliest date to include, inclusive. Defaults to the first price on record.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest date to include, inclusive. Defaults to the last price on record.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The instrument's price history over the requested range.
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSeries"
              examples:
                default:
                  value:
                    uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                    currency: USD
                    from: "2024-01-02"
                    to: "2024-01-04"
                    items:
                      - date: "2024-01-02"
                        value: 185.64
                      - date: "2024-01-03"
                        value: 184.25
                      - date: "2024-01-04"
                        value: 181.91
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/attribute-types:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: listInstrumentAttributeTypes
      tags: [Instruments]
      summary: List the custom attribute definitions for instruments
      description: |
        The user-defined and built-in attribute types that apply to an
        instrument. A client uses this to resolve an attribute id to its
        display name and value `type`. Compound types (`limit-price`,
        `bookmark`, `image`) are listed with `supported: false`; the API
        does not read or write them in v1.
      responses:
        "200":
          description: The applicable attribute definitions.
          headers:
            ETag:
              description: |
                The validator of this representation. Send it back as
                `If-None-Match` on the next request for the same URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttributeDefinition"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

